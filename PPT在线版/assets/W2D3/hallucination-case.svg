<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 365" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,Microsoft YaHei,sans-serif"><rect width="680" height="365" fill="#FFFFFF"/><text x="340" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">幻觉案例：无 RAG vs 有 RAG</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker></defs><text x="20" y="66" text-anchor="start" font-size="11.5" font-weight="700" fill="#221E33">场景：用户问「你们的退款政策是什么？」</text><rect x="20" y="82" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/><text x="80" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#221E33">用户问题</text><text x="80" y="123" text-anchor="middle" font-size="9.5" fill="#7A7590">无资料提供</text><rect x="180" y="82" width="130" height="56" rx="10" fill="#FEEEEF" stroke="#F5C6CB" stroke-width="1.4"/><text x="245" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#221E33">大模型</text><text x="245" y="123" text-anchor="middle" font-size="9.5" fill="#7A7590">只能凭记忆回答</text><rect x="350" y="82" width="250" height="56" rx="10" fill="#FEEEEF" stroke="#F5C6CB" stroke-width="1.4"/><text x="475" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">「72 小时无条件退款」</text><text x="475" y="123" text-anchor="middle" font-size="9.5" fill="#7A7590">模型编造了不存在的政策</text><line x1="140" y1="110" x2="180" y2="110" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arr)"/><line x1="310" y1="110" x2="350" y2="110" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="606" y="82" width="54" height="56" rx="8" fill="#FEEEEF" stroke="#F5C6CB"/><text x="633" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">幻觉</text><text x="633" y="122" text-anchor="middle" font-size="9" font-weight="400" fill="#DC2626">不可信</text><line x1="600" y1="110" x2="606" y2="110" stroke="#DC2626" stroke-width="1.6" marker-end="url(#arr)"/><text x="20" y="196" text-anchor="start" font-size="11.5" font-weight="700" fill="#221E33">接入 RAG：先去知识库查资料，再回答</text><rect x="20" y="212" width="120" height="56" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/><text x="80" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#221E33">用户问题</text><text x="80" y="253" text-anchor="middle" font-size="9.5" fill="#7A7590">同一个问题</text><rect x="180" y="212" width="130" height="56" rx="10" fill="#E7F6F0" stroke="#C2E8D8" stroke-width="1.4"/><text x="245" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#221E33">检索知识库</text><text x="245" y="253" text-anchor="middle" font-size="9.5" fill="#7A7590">找到政策文档</text><rect x="350" y="212" width="250" height="56" rx="10" fill="#E7F6F0" stroke="#C2E8D8" stroke-width="1.4"/><text x="475" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">「7 天内可退，需保留小票」</text><text x="475" y="253" text-anchor="middle" font-size="9.5" fill="#7A7590">答案来自真实文档 [1]</text><line x1="140" y1="240" x2="180" y2="240" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arr)"/><line x1="310" y1="240" x2="350" y2="240" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arr)"/><rect x="606" y="212" width="54" height="56" rx="8" fill="#E7F6F0" stroke="#C2E8D8"/><text x="633" y="236" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">有据</text><text x="633" y="252" text-anchor="middle" font-size="9" font-weight="400" fill="#059669">可查</text><line x1="600" y1="240" x2="606" y2="240" stroke="#059669" stroke-width="1.6" marker-end="url(#arr)"/><path d="M 245 138 L 245 212" fill="none" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arr)"/><text x="268" y="178" text-anchor="middle" font-size="9.5" fill="#7A7590">RAG 介入</text><text x="340" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#7C3AED">幻觉不是模型「笨」，是它根本没没见过你的资料</text><text x="340" y="340" text-anchor="middle" font-size="10.5" font-weight="400" fill="#7A7590">RAG 的本质：先给模型看资料，再让它答题——并要求它标注出处</text></svg>