<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="700" fill="#FFFFFF"/>
<defs>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
</defs>
<rect x="40" y="34" width="4" height="22" fill="#7C3AED"/>
<text x="54" y="52" font-size="20" font-weight="700" fill="#221E33">面试流程图</text>
<text x="54" y="74" font-size="12" fill="#6B7280">五轮面试逐轮拆解 · 谁面 / 考什么 / 淘汰点 · 越往后越接近 offer</text>
<text x="1160" y="52" text-anchor="end" font-size="11" fill="#6B7280">轮次为全集框架，不同公司会合并或增减</text>
<!-- 第1轮 -->
<rect x="36" y="130" width="200" height="300" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/>
<text x="136" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">第1轮 · HR初筛</text>
<line x1="50" y1="182" x2="222" y2="182" stroke="#C9C2DE" stroke-width="1"/>
<text x="48" y="214" font-size="12" font-weight="700" fill="#5B21B6">谁面</text>
<text x="48" y="240" font-size="12" fill="#221E33">招聘HR（10–20分钟）</text>
<text x="48" y="276" font-size="12" font-weight="700" fill="#5B21B6">考察点</text>
<text x="48" y="302" font-size="12" fill="#221E33">动机·稳定性·薪资口径</text>
<line x1="50" y1="330" x2="222" y2="330" stroke="#C9C2DE" stroke-width="1"/>
<text x="48" y="358" font-size="12" font-weight="700" fill="#DC2626">淘汰点</text>
<text x="48" y="384" font-size="12" fill="#DC2626">动机含糊</text>
<!-- 第2轮 -->
<rect x="266" y="130" width="200" height="300" rx="10" fill="#F8F5FE" stroke="#7C3AED" stroke-width="1.6"/>
<text x="366" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">第2轮 · 业务面</text>
<line x1="280" y1="182" x2="452" y2="182" stroke="#C9C2DE" stroke-width="1"/>
<text x="278" y="214" font-size="12" font-weight="700" fill="#5B21B6">谁面</text>
<text x="278" y="240" font-size="12" fill="#221E33">直属上级·同级PM</text>
<text x="278" y="262" font-size="12" fill="#221E33">（45–60分钟）</text>
<text x="278" y="294" font-size="12" font-weight="700" fill="#5B21B6">考察点</text>
