<text x="738" y="294" font-size="12" font-weight="700" fill="#5B21B6">考察点</text>
<text x="738" y="320" font-size="12" fill="#221E33">协作性·需求表达</text>
<line x1="740" y1="344" x2="912" y2="344" stroke="#C9C2DE" stroke-width="1"/>
<text x="738" y="372" font-size="12" font-weight="700" fill="#DC2626">淘汰点</text>
<text x="738" y="396" font-size="12" fill="#DC2626">把协作方当执行资源</text>
<!-- 第5轮 -->
<rect x="956" y="130" width="200" height="300" rx="10" fill="#E0D0F8" stroke="#7C3AED" stroke-width="1.6"/>
<text x="1056" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">第5轮 · HRD面</text>
<line x1="970" y1="182" x2="1142" y2="182" stroke="#C9C2DE" stroke-width="1"/>
<text x="968" y="214" font-size="12" font-weight="700" fill="#5B21B6">谁面</text>
<text x="968" y="240" font-size="12" fill="#221E33">HR负责人</text>
<text x="968" y="262" font-size="12" fill="#221E33">（20–30分钟）</text>
<text x="968" y="294" font-size="12" font-weight="700" fill="#5B21B6">考察点</text>
<text x="968" y="320" font-size="12" fill="#221E33">价值观·抗压·薪酬</text>
<line x1="970" y1="344" x2="1142" y2="344" stroke="#C9C2DE" stroke-width="1"/>
<text x="968" y="372" font-size="12" font-weight="700" fill="#DC2626">淘汰点</text>
<text x="968" y="396" font-size="12" fill="#DC2626">态度反复、负面情绪</text>
<!-- 箭头 -->
<line x1="240" y1="280" x2="260" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="470" y1="280" x2="490" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="700" y1="280" x2="720" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="930" y1="280" x2="950" y2="280" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<!-- 底部横幅 -->
<rect x="36" y="470" width="1128" height="84" rx="12" fill="#F1EBFD"/>
<text x="600" y="520" text-anchor="middle" font-size="18" font-weight="700" fill="#5B21B6">五轮面试 = 同一个假设的五次验证：你能不能来干活</text>
<text x="600" y="600" text-anchor="middle" font-size="12" fill="#6B7280">每轮四步走：谁面 → 考什么 → 怎么死 → 准备动作 · 在导学案逐轮写下「我要防什么」</text>
</svg>
