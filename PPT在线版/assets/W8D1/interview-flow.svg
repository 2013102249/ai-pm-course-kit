<text x="508" y="320" font-size="12" fill="#221E33">判断力·「为什么」层</text>
<line x1="510" y1="344" x2="682" y2="344" stroke="#C9C2DE" stroke-width="1"/>
<text x="508" y="372" font-size="12" font-weight="700" fill="#DC2626">淘汰点</text>
<text x="508" y="396" font-size="12" fill="#DC2626">只讲执行、失败全归外部</text>
<!-- 第4轮 -->
<rect x="726" y="130" width="200" height="300" rx="10" fill="#E9DFFB" stroke="#7C3AED" stroke-width="1.6"/>
<text x="826" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">第4轮 · 交叉面</text>
<line x1="740" y1="182" x2="912" y2="182" stroke="#C9C2DE" stroke-width="1"/>
