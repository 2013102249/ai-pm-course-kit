<text x="278" y="396" font-size="12" fill="#DC2626">追问两层露馅</text>
<!-- 第3轮 -->
<rect x="496" y="130" width="200" height="300" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
<text x="596" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">第3轮 · 总监面</text>
<line x1="510" y1="182" x2="682" y2="182" stroke="#C9C2DE" stroke-width="1"/>
