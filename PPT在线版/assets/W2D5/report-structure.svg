<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#FFFFFF"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker></defs>
<rect x="20" y="24" width="4" height="22" fill="#7C3AED"/>
<text x="34" y="42" font-size="20" font-weight="700" fill="#221E33">立项报告六章结构图</text>
<text x="34" y="62" font-size="12" fill="#6B7280">纵向六步 · 逐章一句话讲法 + 反例 · 配合导学案空白模板</text>
<!-- ① -->
<rect x="400" y="100" width="440" height="78" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<circle cx="438" cy="139" r="16" fill="#7C3AED"/>
<text x="438" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="468" y="134" font-size="17" font-weight="700" fill="#221E33">选题概述</text>
<text x="468" y="158" font-size="12.5" fill="#6B7280">一句话说清：做什么、给谁用、解决什么</text>
<line x1="620" y1="178" x2="620" y2="202" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- ② -->
<rect x="400" y="208" width="440" height="78" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<circle cx="438" cy="247" r="16" fill="#7C3AED"/>
<text x="438" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="468" y="242" font-size="17" font-weight="700" fill="#221E33">目标用户画像</text>
<text x="468" y="266" font-size="12.5" fill="#6B7280">可触达的一类人，具体到场景与频次</text>
<line x1="620" y1="286" x2="620" y2="310" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- ③ -->
<rect x="400" y="316" width="440" height="78" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<circle cx="438" cy="355" r="16" fill="#7C3AED"/>
<text x="438" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="468" y="350" font-size="17" font-weight="700" fill="#221E33">核心场景</text>
<text x="468" y="374" font-size="12.5" fill="#6B7280">高频 · 具体 · 有痛点的真实任务</text>
<line x1="620" y1="394" x2="620" y2="418" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- ④ -->
<rect x="400" y="424" width="440" height="78" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
<circle cx="438" cy="463" r="16" fill="#7C3AED"/>
<text x="438" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="468" y="458" font-size="17" font-weight="700" fill="#221E33">成功指标</text>
<text x="468" y="482" font-size="12.5" fill="#6B7280">给「成功」下一个可测量的定义</text>
<line x1="840" y1="463" x2="876" y2="463" stroke="#A5A1B8" stroke-width="1"/>
<rect x="880" y="448" width="250" height="30" rx="15" fill="#F1EBFD" stroke="#7C3AED"/>
<text x="1005" y="468" text-anchor="middle" font-size="12" font-weight="700" fill="#7C3AED">口诀：可测量 · 有数字 · 有期限</text>
<line x1="620" y1="502" x2="620" y2="526" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- ⑤ -->
<rect x="400" y="532" width="440" height="78" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<circle cx="438" cy="571" r="16" fill="#7C3AED"/>
<text x="438" y="576" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<text x="468" y="566" font-size="17" font-weight="700" fill="#221E33">四维可行性自评</text>
<text x="468" y="590" font-size="12.5" fill="#6B7280">技术 / 数据 / 合规 / 竞争 逐维打分</text>
<line x1="620" y1="610" x2="620" y2="634" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<!-- ⑥ -->
<rect x="400" y="640" width="440" height="78" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<circle cx="438" cy="679" r="16" fill="#7C3AED"/>
<text x="438" y="684" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
<text x="468" y="674" font-size="17" font-weight="700" fill="#221E33">风险与对策</text>
<text x="468" y="698" font-size="12.5" fill="#6B7280">每个主要风险配一条可执行对策</text>
<line x1="840" y1="679" x2="876" y2="679" stroke="#A5A1B8" stroke-width="1"/>
<rect x="880" y="664" width="190" height="30" rx="15" fill="#FFFFFF" stroke="#DC2626"/>
<text x="975" y="684" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">评审质询高频考点</text>
<text x="620" y="762" text-anchor="middle" font-size="13" fill="#6B7280">「用户很喜欢」不算成功指标——改成「7 日留存 ≥ 40%」这类可量化表述。</text>
</svg>
