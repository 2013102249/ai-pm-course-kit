<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/>
    </marker>
  </defs>
  <rect x="40" y="42" width="4" height="22" fill="#7C3AED"/>
  <text x="54" y="60" font-size="20" font-weight="700" fill="#221E33">AB 实验流程图</text>
  <text x="54" y="82" font-size="12" fill="#6B7280">假设 → 设计 → 灰度 → 全量 → 决策 · 决策是下一轮假设的起点</text>

  <!-- 顶部回环虚线 -->
  <path d="M1060,274 C1000,158 200,158 140,274" fill="none" stroke="#A5A1B8" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <rect x="552" y="166" width="96" height="24" rx="12" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/>
  <text x="600" y="183" text-anchor="middle" font-size="13" fill="#6B7280">下一轮假设</text>

  <!-- 主流程箭头 -->
  <line x1="242" y1="367" x2="262" y2="367" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="472" y1="367" x2="492" y2="367" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="702" y1="367" x2="722" y2="367" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="932" y1="367" x2="952" y2="367" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 五节点 -->
  <rect x="40" y="292" width="200" height="150" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <rect x="270" y="292" width="200" height="150" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <rect x="500" y="292" width="200" height="150" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.6"/>
  <rect x="730" y="292" width="200" height="150" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <rect x="960" y="292" width="200" height="150" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>

  <circle cx="140" cy="292" r="15" fill="#7C3AED"/><text x="140" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="370" cy="292" r="15" fill="#7C3AED"/><text x="370" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="600" cy="292" r="15" fill="#FFFFFF"/><text x="600" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">3</text>
  <circle cx="830" cy="292" r="15" fill="#7C3AED"/><text x="830" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
  <circle cx="1060" cy="292" r="15" fill="#7C3AED"/><text x="1060" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>

  <text x="140" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#221E33">假设</text>
  <text x="140" y="380" text-anchor="middle" font-size="16" fill="#221E33">可证伪</text>
  <text x="140" y="410" text-anchor="middle" font-size="14" fill="#6B7280">「数据打脸时我承认」</text>

  <text x="370" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#221E33">设计</text>
  <text x="370" y="380" text-anchor="middle" font-size="16" fill="#221E33">四要素</text>
  <text x="370" y="410" text-anchor="middle" font-size="14" fill="#6B7280">「假设 · 指标 · 样本 · 周期」</text>

  <text x="600" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">灰度</text>
  <text x="600" y="380" text-anchor="middle" font-size="16" fill="#FFFFFF">小比例放量</text>
  <text x="600" y="410" text-anchor="middle" font-size="14" fill="#BFDBFE">「给 bug 留缓冲带」</text>

  <text x="830" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#221E33">全量</text>
  <text x="830" y="380" text-anchor="middle" font-size="16" fill="#221E33">判读通过后放开</text>
  <text x="830" y="410" text-anchor="middle" font-size="14" fill="#6B7280">「三道闸过了才全量」</text>

  <text x="1060" y="346" text-anchor="middle" font-size="24" font-weight="700" fill="#221E33">决策</text>
  <text x="1060" y="380" text-anchor="middle" font-size="16" fill="#221E33">进入下一轮假设</text>
  <text x="1060" y="410" text-anchor="middle" font-size="14" fill="#6B7280">「增长是永不收敛的循环」</text>

  <!-- 灰度强调标签 -->
  <rect x="534" y="458" width="132" height="26" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="600" y="476" text-anchor="middle" font-size="12.5" fill="#2563EB">容易漏的一步</text>

  <!-- 底部金句 -->
  <rect x="60" y="576" width="1080" height="56" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="600" y="611" text-anchor="middle" font-size="17" font-weight="700" fill="#5B21B6">决策不是终点，是下一轮假设的起点。</text>
</svg>
