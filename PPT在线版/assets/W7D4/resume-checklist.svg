<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"><rect width="1200" height="1400" fill="#F7F6FB"/><rect x="48" y="38" width="4" height="22" fill="#7C3AED"/><text x="62" y="56" font-size="20" font-weight="700" fill="#221E33">简历自检 20 项清单</text><text x="62" y="76" font-size="12" fill="#6B7280">五组 × 4 项 · 诊断与验收的统一标准 · 项项能打勾，才算可投递</text>

<rect x="80" y="120" width="1040" height="40" rx="8" fill="#7C3AED"/><text x="104" y="147" font-size="16" font-weight="700" fill="#FFFFFF">A · 定位组</text><text x="1096" y="146" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">共 4 项</text><rect x="80" y="168" width="1040" height="168" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="104" y="180" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="195" font-size="14" font-weight="700" fill="#7C3AED">A1</text><text x="185" y="195" font-size="15" fill="#221E33">一句话定位明确，求职意向写清「AI 产品经理 + 行业」</text><line x1="100" y1="210" x2="1100" y2="210" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="222" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="237" font-size="14" font-weight="700" fill="#7C3AED">A2</text><text x="185" y="237" font-size="15" fill="#221E33">目标岗位 JD 关键词匹配 ≥5 个</text><line x1="100" y1="252" x2="1100" y2="252" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="264" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="279" font-size="14" font-weight="700" fill="#7C3AED">A3</text><text x="185" y="279" font-size="15" fill="#221E33">黄金位（上半屏）放最强项目与数字结果</text><line x1="100" y1="294" x2="1100" y2="294" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="306" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="321" font-size="14" font-weight="700" fill="#7C3AED">A4</text><text x="185" y="321" font-size="15" fill="#221E33">无与目标岗位无关的冗余经历占据黄金位</text>

<rect x="80" y="352" width="1040" height="40" rx="8" fill="#2563EB"/><text x="104" y="379" font-size="16" font-weight="700" fill="#FFFFFF">B · 结构组</text><text x="1096" y="378" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">共 4 项</text><rect x="80" y="400" width="1040" height="168" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="104" y="412" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="427" font-size="14" font-weight="700" fill="#2563EB">B1</text><text x="185" y="427" font-size="15" fill="#221E33">全文 1 页以内</text><line x1="100" y1="442" x2="1100" y2="442" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="454" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="469" font-size="14" font-weight="700" fill="#2563EB">B2</text><text x="185" y="469" font-size="15" fill="#221E33">模块顺序合理：基本信息 → 核心优势 → 项目 → 经历 → 教育背景</text><line x1="100" y1="484" x2="1100" y2="484" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="496" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="511" font-size="14" font-weight="700" fill="#2563EB">B3</text><text x="185" y="511" font-size="15" fill="#221E33">排版利于机器解析（ATS）：无复杂表格与图形化文字</text><line x1="100" y1="526" x2="1100" y2="526" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="538" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="553" font-size="14" font-weight="700" fill="#2563EB">B4</text><text x="185" y="553" font-size="15" fill="#221E33">时间线连续，空窗期有事件式交代</text>

<rect x="80" y="584" width="1040" height="40" rx="8" fill="#7C3AED"/><text x="104" y="611" font-size="16" font-weight="700" fill="#FFFFFF">C · 项目组</text><text x="1096" y="610" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">共 4 项</text><rect x="80" y="632" width="1040" height="168" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="104" y="644" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="659" font-size="14" font-weight="700" fill="#7C3AED">C1</text><text x="185" y="659" font-size="15" fill="#221E33">主项目排第一且篇幅最大</text><line x1="100" y1="674" x2="1100" y2="674" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="686" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="701" font-size="14" font-weight="700" fill="#7C3AED">C2</text><text x="185" y="701" font-size="15" fill="#221E33">每段项目按「背景—动作—结果」展开</text><line x1="100" y1="716" x2="1100" y2="716" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="728" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="743" font-size="14" font-weight="700" fill="#7C3AED">C3</text><text x="185" y="743" font-size="15" fill="#221E33">动作以动词开头且可验证（主导/设计/推动）</text><line x1="100" y1="758" x2="1100" y2="758" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="770" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="785" font-size="14" font-weight="700" fill="#7C3AED">C4</text><text x="185" y="785" font-size="15" fill="#221E33">项目能力与目标岗位要求一一对应</text>

<rect x="80" y="816" width="1040" height="40" rx="8" fill="#2563EB"/><text x="104" y="843" font-size="16" font-weight="700" fill="#FFFFFF">D · 数据组</text><text x="1096" y="842" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">共 4 项</text><rect x="80" y="864" width="1040" height="168" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="104" y="876" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="891" font-size="14" font-weight="700" fill="#2563EB">D1</text><text x="185" y="891" font-size="15" fill="#221E33">每段项目经历至少 1 个数字结果</text><line x1="100" y1="906" x2="1100" y2="906" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="918" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="933" font-size="14" font-weight="700" fill="#2563EB">D2</text><text x="185" y="933" font-size="15" fill="#221E33">数字有出处、口径可复述，无编造</text><line x1="100" y1="948" x2="1100" y2="948" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="960" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="975" font-size="14" font-weight="700" fill="#2563EB">D3</text><text x="185" y="975" font-size="15" fill="#221E33">指标与业务目标挂钩（留存/转化/效率/成本）</text><line x1="100" y1="990" x2="1100" y2="990" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="1002" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="1017" font-size="14" font-weight="700" fill="#2563EB">D4</text><text x="185" y="1017" font-size="15" fill="#221E33">有对比呈现（改进前后或高于基线）</text>

<rect x="80" y="1048" width="1040" height="40" rx="8" fill="#7C3AED"/><text x="104" y="1075" font-size="16" font-weight="700" fill="#FFFFFF">E · 格式组</text><text x="1096" y="1074" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">共 4 项</text><rect x="80" y="1096" width="1040" height="168" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="104" y="1108" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="1123" font-size="14" font-weight="700" fill="#7C3AED">E1</text><text x="185" y="1123" font-size="15" fill="#221E33">字体不超过 2 种，字号层级清晰</text><line x1="100" y1="1138" x2="1100" y2="1138" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="1150" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="1165" font-size="14" font-weight="700" fill="#7C3AED">E2</text><text x="185" y="1165" font-size="15" fill="#221E33">无错别字，标点全半角统一</text><line x1="100" y1="1180" x2="1100" y2="1180" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="1192" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="1207" font-size="14" font-weight="700" fill="#7C3AED">E3</text><text x="185" y="1207" font-size="15" fill="#221E33">文件命名规范：姓名-AI产品经理-简历.pdf</text><line x1="100" y1="1222" x2="1100" y2="1222" stroke="#E8E5F1" stroke-width="1"/><rect x="104" y="1234" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#A5A1B8" stroke-width="1.6"/><text x="140" y="1249" font-size="14" font-weight="700" fill="#7C3AED">E4</text><text x="185" y="1249" font-size="15" fill="#221E33">联系方式有效，照片与隐私信息恰当</text>

<rect x="80" y="1296" width="1040" height="56" rx="10" fill="#5B21B6"/><text x="600" y="1331" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">简历不是写出来的，是改出来的——改到 HR 停下来为止。</text></svg>
