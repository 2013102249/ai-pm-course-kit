<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="700" fill="#FFFFFF"/>
<defs>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
</defs>
<rect x="48" y="44" width="4" height="22" fill="#7C3AED"/>
<text x="62" y="61" font-size="20" font-weight="700" fill="#221E33">选赛道三标准决策图</text>
<text x="62" y="82" font-size="12" fill="#6B7280">从左到右逐框打分，三个标准冲突时按底部口诀排优先级</text>

<!-- 框1 -->
<rect x="48" y="130" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
<text x="198" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#221E33">① 个人基础匹配度</text>
<line x1="198" y1="206" x2="198" y2="240" stroke="#C9C2DE" stroke-width="1.4"/>
<rect x="48" y="240" width="300" height="150" rx="10" fill="#FAF9FE" stroke="#E8E5F1" stroke-width="1"/>
<text x="66" y="274" font-size="14" fill="#4A4560">· 经历能迁移吗</text>
<text x="66" y="302" font-size="14" fill="#4A4560">· 有人脉可约谈吗</text>
<text x="66" y="330" font-size="14" fill="#4A4560">· 有赛道好奇心吗</text>
<text x="66" y="364" font-size="12" fill="#6B7280">（三样占两样即高分）</text>
<line x1="352" y1="168" x2="442" y2="168" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

<!-- 框2 -->
<rect x="450" y="130" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8"/>
<text x="600" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#221E33">② 岗位池与进入概率</text>
<line x1="600" y1="206" x2="600" y2="240" stroke="#C9C2DE" stroke-width="1.4"/>
<rect x="450" y="240" width="300" height="150" rx="10" fill="#FAF9FE" stroke="#E8E5F1" stroke-width="1"/>
<text x="468" y="274" font-size="14" fill="#4A4560">· 岗位密度 × 现有匹配度</text>
<text x="484" y="296" font-size="14" fill="#4A4560">÷ 补课成本</text>
<text x="468" y="332" font-size="14" font-weight="700" fill="#5B21B6">· 「先上车，再换座」</text>
<line x1="754" y1="168" x2="844" y2="168" stroke="#2563EB" stroke-width="2" marker-end="url(#arrB)"/>

<!-- 框3 -->
<rect x="852" y="130" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8"/>
<text x="1002" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#221E33">③ 成长时间窗</text>
<line x1="1002" y1="206" x2="1002" y2="240" stroke="#C9C2DE" stroke-width="1.4"/>
<rect x="852" y="240" width="300" height="150" rx="10" fill="#FAF9FE" stroke="#E8E5F1" stroke-width="1"/>
<text x="870" y="274" font-size="14" fill="#4A4560">· 赛道 AI 投入在加速还是退潮</text>
<text x="870" y="302" font-size="14" fill="#4A4560">· 三五年后是增值还是打转</text>

<!-- 口诀条 -->
<rect x="48" y="440" width="1104" height="64" rx="10" fill="#7C3AED"/>
<text x="600" y="480" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">匹配度优先，进入概率兜底，时间窗做校正</text>
<text x="600" y="548" text-anchor="middle" font-size="12" fill="#7A7590">匹配度决定你跑得多顺，进入概率决定你跑得多快，时间窗决定你能跑多远</text>
</svg>
