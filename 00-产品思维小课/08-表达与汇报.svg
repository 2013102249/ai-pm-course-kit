<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="800" fill="#F8F8FC"/>
<rect width="1200" height="96" fill="url(#hd)"/>
<text x="50" y="60" font-size="30" font-weight="700" fill="#FFFFFF">表达与汇报 · 结论先行三段式：第一句话就是你的判断或请求</text>
<text x="1150" y="60" font-size="15" fill="#FFFFFF" text-anchor="end" opacity="0.85">AI 产品经理就业训练营 · 产品思维小课</text>
<rect x="90" y="140" width="1020" height="140" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="90" y="140" width="10" height="140" rx="5" fill="#7C3AED"/>
<text x="130" y="192" font-size="22" fill="#111827" font-weight="700" text-anchor="start">第一段 · 结论</text>
<text x="130" y="238" font-size="17" fill="#374151" font-weight="normal" text-anchor="start">一句话说清你的判断或请求——先给答案，不给铺垫</text>
<text x="1060" y="192" font-size="20" fill="#7C3AED" font-weight="700" text-anchor="middle">1/3</text>
<rect x="90" y="310" width="1020" height="140" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="90" y="310" width="10" height="140" rx="5" fill="#2563EB"/>
<text x="130" y="362" font-size="22" fill="#111827" font-weight="700" text-anchor="start">第二段 · 依据</text>
<text x="130" y="408" font-size="17" fill="#374151" font-weight="normal" text-anchor="start">2–3 条支撑，必须含数字：基准值 → 结果值 + 来源</text>
<text x="1060" y="362" font-size="20" fill="#2563EB" font-weight="700" text-anchor="middle">2/3</text>
<rect x="90" y="480" width="1020" height="140" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="90" y="480" width="10" height="140" rx="5" fill="#7C3AED"/>
<text x="130" y="532" font-size="22" fill="#111827" font-weight="700" text-anchor="start">第三段 · 行动</text>
<text x="130" y="578" font-size="17" fill="#374151" font-weight="normal" text-anchor="start">下一步要什么、要谁拍板、什么时候要——没有行动段的汇报是散文</text>
<text x="1060" y="532" font-size="20" fill="#7C3AED" font-weight="700" text-anchor="middle">3/3</text>
<rect x="90" y="645" width="1020" height="56" rx="12" fill="#F1EDFB" stroke="#2563EB" stroke-width="1.5"/>
<text x="600" y="681" font-size="17" fill="#111827" font-weight="700" text-anchor="middle">背景沉到最后：对方追问再讲——「所以你要我做什么」这句话，永远别让它出现在你的汇报里</text>
<line x1="0" y1="752" x2="1200" y2="752" stroke="#E5E7EB"/>
<text x="50" y="778" font-size="14" fill="#6B7280">产品思维小课 08 · 表达与汇报 ｜ 课堂用法：反例 → 本图 1 分钟 → 30 秒自我介绍按三段式，今日对 2 位同学各讲一遍</text>
<text x="1150" y="778" font-size="14" fill="#6B7280" text-anchor="end">紫 #7C3AED / 蓝 #2563EB · 1200×800</text>
</svg>