<text x="620" y="600" font-size="16" fill="#7C3AED" font-weight="700" text-anchor="middle">下一轮目标从第 ④ 步长出来——复盘不是终点，是下个循环的起点</text>
<text x="60" y="690" font-size="17" fill="#111827" font-weight="700" text-anchor="start">口诀：先查流程再查人；『下次注意』不是结论——写不出人和时间的复盘，等于没开。</text>
