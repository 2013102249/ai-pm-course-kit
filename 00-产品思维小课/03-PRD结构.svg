<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="800" fill="#F8F8FC"/>
<rect width="1200" height="96" fill="url(#hd)"/>
<text x="50" y="60" font-size="30" font-weight="700" fill="#FFFFFF">PRD 结构 · 六块骨架：异常流不少于正常流，『不做什么』必须写</text>
<text x="1150" y="60" font-size="15" fill="#FFFFFF" text-anchor="end" opacity="0.85">AI 产品经理就业训练营 · 产品思维小课</text>
<rect x="70" y="140" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="70" y="140" width="320" height="8" rx="4" fill="#7C3AED"/>
<text x="96" y="202" font-size="21" fill="#111827" font-weight="700" text-anchor="start">01 背景与目标</text>
<text x="96" y="246" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">为什么做，目标可衡量</text>
<rect x="440" y="140" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="440" y="140" width="320" height="8" rx="4" fill="#2563EB"/>
<text x="466" y="202" font-size="21" fill="#111827" font-weight="700" text-anchor="start">02 用户与场景</text>
<text x="466" y="246" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">给谁用、在什么场景下用</text>
<rect x="810" y="140" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="810" y="140" width="320" height="8" rx="4" fill="#7C3AED"/>
<text x="836" y="202" font-size="21" fill="#111827" font-weight="700" text-anchor="start">03 需求详述</text>
<text x="836" y="246" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">正常流 + 异常流，异常不少于正常</text>
<rect x="70" y="380" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="70" y="380" width="320" height="8" rx="4" fill="#2563EB"/>
<text x="96" y="442" font-size="21" fill="#111827" font-weight="700" text-anchor="start">04 数据埋点</text>
<text x="96" y="486" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">上线后怎么知道好没好</text>
<rect x="440" y="380" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="440" y="380" width="320" height="8" rx="4" fill="#2563EB"/>
<text x="466" y="442" font-size="21" fill="#111827" font-weight="700" text-anchor="start">05 边界与不做的事</text>
<text x="466" y="486" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">防止范围膨胀的第一道闸</text>
<rect x="810" y="380" width="320" height="190" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="810" y="380" width="320" height="8" rx="4" fill="#7C3AED"/>
<text x="836" y="442" font-size="21" fill="#111827" font-weight="700" text-anchor="start">06 非功能要求</text>
<text x="836" y="486" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">性能、安全、合规底线</text>
<text x="70" y="645" font-size="17" fill="#111827" font-weight="700" text-anchor="start">检查法：只读第 01 块，开发能不能说出要做什么？只读第 03 块异常流，客服能不能接住故障？</text>
<text x="70" y="678" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">常见病：把 03 写成一句『做一个 XX 系统』——那不是 PRD，是许愿。</text>
<line x1="0" y1="752" x2="1200" y2="752" stroke="#E5E7EB"/>
<text x="50" y="778" font-size="14" fill="#6B7280">产品思维小课 03 · PRD 结构 ｜ 课堂用法：反例 → 本图 1 分钟 → 今日架构草图每个工具补一行『失败时怎么办』</text>
<text x="1150" y="778" font-size="14" fill="#6B7280" text-anchor="end">紫 #7C3AED / 蓝 #2563EB · 1200×800</text>
</svg>