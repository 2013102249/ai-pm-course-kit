<text x="957" y="565" font-size="16" fill="#374151" font-weight="normal" text-anchor="middle">归档并写明卡在哪一问</text>
<text x="60" y="690" font-size="17" fill="#111827" font-weight="700" text-anchor="start">口诀：先找人，再问频率，再看替代品，最后算不做的代价——四问滤过，才轮得到排期。</text>
