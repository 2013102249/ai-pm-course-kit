<text x="296" y="172" font-size="21" fill="#111827" font-weight="700" text-anchor="start">问 1 · 谁在痛？</text>
<text x="296" y="208" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">有具体的人吗？叫得出名字吗</text>
