<rect x="270" y="268" width="6" height="118" rx="3" fill="#2563EB"/>
<text x="296" y="310" font-size="21" fill="#111827" font-weight="700" text-anchor="start">问 2 · 痛多久？</text>
<text x="296" y="346" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">高频还是偶发？一次还是每天</text>
<rect x="270" y="406" width="430" height="118" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="270" y="406" width="6" height="118" rx="3" fill="#7C3AED"/>
<text x="296" y="448" font-size="21" fill="#111827" font-weight="700" text-anchor="start">问 3 · 怎么活？</text>
<text x="296" y="484" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">没有它，用户现在用什么替代</text>
<rect x="270" y="544" width="430" height="118" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
