<text x="296" y="586" font-size="21" fill="#111827" font-weight="700" text-anchor="start">问 4 · 不做会怎样？</text>
<text x="296" y="622" font-size="16" fill="#374151" font-weight="normal" text-anchor="start">最坏结果写得出具体场景吗</text>
<line x1="705" y1="400" x2="750" y2="400" stroke="#2563EB" stroke-width="2.5"/><polygon points="760,400 746,394 746,406" fill="#2563EB"/>
<rect x="765" y="150" width="385" height="150" rx="14" fill="#F1EDFB" stroke="#7C3AED" stroke-width="1.5"/>
