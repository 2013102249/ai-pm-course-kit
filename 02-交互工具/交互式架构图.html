<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式架构图 · AI 产品经理训练营</title>
<style>
  :root{
    --purple:#7C3AED; --purple-deep:#5B21B6; --purple-light:#F1EBFD; --purple-border:#DDD2F7;
    --blue:#2563EB; --blue-light:#E8EFFD; --blue-border:#C9D9F8;
    --ink:#221E33; --ink2:#4A4560; --muted:#7A7590; --faint:#A5A1B8;
    --bg:#F7F6FB; --card:#FFFFFF; --border:#E8E5F1; --border-soft:#F0EEF7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:14.5px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  .hero{background:linear-gradient(135deg,#2A1B52 0%,#4A2A85 50%,#2B4A9E 100%);color:#fff;padding:30px 0 26px}
  .hero .badge{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:2px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 13px;color:rgba(255,255,255,.85);margin-bottom:12px}
  .hero .badge .dot{width:6px;height:6px;border-radius:50%;background:#C4B5FD;box-shadow:0 0 8px #C4B5FD}
  .hero h1{font-size:23px;font-weight:700;letter-spacing:.5px}
  .hero p{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px}
  /* Tabs */
  .tabs{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px}
  .tab{border:1px solid var(--border);background:#FBFAFD;border-radius:999px;padding:7px 18px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;font-family:inherit;transition:.15s}
  .tab:hover{border-color:var(--purple);color:var(--purple-deep)}
  .tab.on{background:var(--purple);border-color:var(--purple);color:#fff}
  /* 主区 */
  main{padding:18px 0 10px}
  .layout{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
  .diagcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
  .diagcard svg{width:100%;height:auto;display:block}
  .oneline{margin-top:12px;background:var(--purple-light);border:1px solid var(--purple-border);border-radius:10px;padding:10px 14px;font-size:12.8px;color:var(--purple-deep)}
  .oneline b{font-weight:700}
  /* 说明卡 */
  .side{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;position:sticky;top:64px}
  .side .back{display:none;font-size:12px;color:var(--blue);cursor:pointer;font-weight:600;margin-bottom:12px;border:none;background:none;font-family:inherit;padding:0}
  .side .back.show{display:inline-block}
  .side .kicker{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--purple);margin-bottom:6px}
  .side h2{font-size:17px;font-weight:700;margin-bottom:12px}
  .side .block{margin-bottom:14px}
  .side .block .bt{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:1px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .side .block .bt i{width:6px;height:6px;border-radius:50%;background:var(--purple);display:inline-block}
  .side .block p{font-size:13px;color:var(--ink2)}
  .side .block ul{margin-left:18px;font-size:13px;color:var(--ink2)}
  .side .block ul li{margin-bottom:4px}
  .quote{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--blue)}
  .quote b{display:block;font-size:11px;letter-spacing:1px;margin-bottom:4px;opacity:.8}
  .hint{font-size:12px;color:var(--faint);margin-top:14px;border-top:1px dashed var(--border);padding-top:10px}
  /* SVG 节点 */
  .node{cursor:pointer}
  .node rect{fill:#FFFFFF;stroke:#C9C2DE;stroke-width:1.4;transition:all .15s}
  .node text{pointer-events:none}
  .node .nl{font-size:13px;font-weight:700;fill:var(--ink)}
  .node .ns{font-size:10px;fill:var(--muted)}
  .node .np{font-size:9.5px;font-weight:700;fill:var(--purple)}
  .node:hover rect{stroke:var(--purple);stroke-width:2.2;filter:drop-shadow(0 3px 8px rgba(124,58,237,.25))}
  .node.sel rect{stroke:var(--purple);stroke-width:2.6;fill:var(--purple-light)}
  .edge{stroke:#C9C2DE;stroke-width:1.6;fill:none}
  .edge.dash{stroke-dasharray:6 5;animation:flow 1.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-22}}
  .elabel{font-size:9.5px;fill:var(--faint)}
  footer{padding:24px 0 44px;text-align:center;color:var(--faint);font-size:12px}
  @media (max-width:900px){
    .layout{grid-template-columns:1fr}
    .side{position:static}
    .hero h1{font-size:19px}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="badge"><span class="dot"></span>INTERACTIVE ARCHITECTURE · 课堂工具</div>
    <h1>AI 架构交互式讲解图</h1>
    <p>点击图中任意节点，查看「是什么 / 产品经理要关心什么 / 面试怎么答」三段式讲解。默认显示整张图的一分钟讲法。</p>
  </div>
</header>

<div class="tabs">
  <div class="wrap" id="tabs">
    <button class="tab on" data-d="llm">LLM 基础链路</button>
    <button class="tab" data-d="rag">RAG 架构</button>
    <button class="tab" data-d="agent">Agent 架构</button>
    <button class="tab" data-d="full">AI 产品全链路</button>
  </div>
</div>

<main class="wrap">
  <div class="layout">
    <div>
      <div class="diagcard"><svg id="svg" viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="oneline" id="oneline"></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</main>

<footer>交互式架构图 · AI 产品经理就业训练营课堂工具</footer>

/* ================= 渲染 ================= */
var curD = 'llm';
var curNode = null;
var NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* 节点内文字超宽时强制收缩适配（杜绝任何文字溢出/重叠） */
function fitNodeText(t, maxW, fs){
  var s = t.textContent || '';
  var w = 0;
  for(var i = 0; i < s.length; i++){ w += (s.charCodeAt(i) > 255 ? fs : fs * 0.56); }
  if(w > maxW){
    t.setAttribute('textLength', maxW);
    t.setAttribute('lengthAdjust', 'spacingAndGlyphs');
  }
}

function nodeById(d, id){
  return DIAGRAMS[d].nodes.filter(function(n){return n.id === id;})[0];
}
function center(n, side){
  var cx = n.x + n.w/2, cy = n.y + n.h/2;
  if(side === 'top') return [cx, n.y];
  if(side === 'bottom') return [cx, n.y + n.h];
  if(side === 'left') return [n.x, cy];
  return [n.x + n.w, cy];
}

function renderDiagram(key){
  curD = key; curNode = null;
  var d = DIAGRAMS[key];
  var svg = document.getElementById('svg');
  svg.innerHTML = '';
  /* 定义箭头 marker */
  var defs = el('defs', {});
  var mk = el('marker', {id:'arr', viewBox:'0 0 10 10', refX:9, refY:5, markerWidth:7, markerHeight:7, orient:'auto-start-reverse'});
  mk.appendChild(el('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:'#A5A1B8'}));
  defs.appendChild(mk);
  svg.appendChild(defs);

  /* 边 */
  d.edges.forEach(function(e){
    var a = nodeById(key, e.from), b = nodeById(key, e.to);
    var p;
    if(e.path){ p = el('path', {d:e.path}); }
    else {
      var pa = center(a, (b.x > a.x ? 'right' : 'left'));
      var pb = center(b, (b.x > a.x ? 'left' : 'right'));
      p = el('line', {x1:pa[0], y1:pa[1], x2:pb[0], y2:pb[1]});
    }
    p.setAttribute('class', 'edge' + (e.dash ? ' dash' : ''));
    p.setAttribute('marker-end', 'url(#arr)');
    svg.appendChild(p);
    if(e.label){
      var mid = e.path ? midOfPath(e.path) : null;
      if(mid){
      var lx = (e.lx !== undefined) ? e.lx : mid[0];
      var ly = (e.ly !== undefined) ? e.ly : mid[1] - 5;
      var t = el('text', {x:lx, y:ly, 'text-anchor':'middle', 'class':'elabel'});
      t.textContent = e.label;
        svg.appendChild(t);
      }
    }
  });

  /* 节点 */
  d.nodes.forEach(function(n){
    var g = el('g', {'class':'node', 'data-id':n.id});
    var title = el('title', {});
    title.textContent = n.sub || n.label;
    g.appendChild(title);
    g.appendChild(el('rect', {x:n.x, y:n.y, width:n.w, height:n.h, rx:10}));
    var t1 = el('text', {x:n.x + n.w/2, y:n.y + (typeof n.pm === 'string' ? 21 : (n.sub ? 26 : 30)), 'text-anchor':'middle', 'class':'nl'});
    t1.textContent = n.label;
    fitNodeText(t1, n.w - 8, 13);
    g.appendChild(t1);
    if(n.sub){
      var t2 = el('text', {x:n.x + n.w/2, y:n.y + 36, 'text-anchor':'middle', 'class':'ns'});
      t2.textContent = n.sub;
      fitNodeText(t2, n.w - 8, 10);
      g.appendChild(t2);
    }
    if(typeof n.pm === 'string'){
      var t3 = el('text', {x:n.x + n.w/2, y:n.y + 45, 'text-anchor':'middle', 'class':'np'});
      t3.textContent = n.pm;
      fitNodeText(t3, n.w - 8, 9.5);
      g.appendChild(t3);
    }
    g.addEventListener('click', function(){ showNode(key, n.id); });
    svg.appendChild(g);
  });

  document.getElementById('oneline').innerHTML = d.oneline;
  showSummary();
}

function midOfPath(d){
  var m = d.match(/M\s*([\d.]+)\s+([\d.]+)[\sLCS]*([\d.]+)\s+([\d.]+)\s*$/);
  if(m) return [(+m[1] + +m[3])/2, (+m[2] + +m[4])/2];
  var m2 = d.match(/M\s*([\d.]+)\s+([\d.]+)/);
  return m2 ? [+m2[1], +m2[2]] : [0,0];
}

function showSummary(){
  var d = DIAGRAMS[curD];
  var side = document.getElementById('side');
  side.innerHTML =
    '<button class="back" id="backBtn">← 返回总览</button>' +
    '<div class="kicker">总览讲解</div>' +
    '<h2>' + d.name + ' · 一分钟讲法</h2>' +
    '<div class="block"><div class="bt"><i></i>整条链路</div><p>' + d.summary + '</p></div>' +
    '<div class="block"><div class="bt"><i></i>课堂用法</div><p>先按这张图把全场讲一遍，再点击任意节点展开三段式细讲。建议每张图配一个真实产品案例（如 RAG 配知识库问答产品）。</p></div>' +
    '<div class="quote"><b>面试金句</b>' + d.oneline.replace(/<[^>]+>/g, '') + '</div>' +
    '<div class="hint">提示：悬停节点查看英文全称，点击节点查看「是什么 / 产品经理要关心什么 / 面试怎么答」。</div>';
  document.getElementById('backBtn').classList.remove('show');
}

function showNode(key, id){
  var n = nodeById(key, id);
  var side = document.getElementById('side');
  var pmList = (n.pm2 || n.pm || []).map(function(x){return '<li>' + x + '</li>';}).join('');
  side.innerHTML =
    '<button class="back show" id="backBtn">← 返回总览</button>' +
    '<div class="kicker">' + DIAGRAMS[key].name + ' · 节点讲解</div>' +
    '<h2>' + n.label + (n.sub ? ' <span style="font-size:12px;color:var(--muted);font-weight:500">' + n.sub + '</span>' : '') + '</h2>' +
    '<div class="block"><div class="bt"><i></i>是什么</div><p>' + n.what + '</p></div>' +
    '<div class="block"><div class="bt"><i></i>产品经理要关心什么</div><ul>' + pmList + '</ul></div>' +
    '<div class="quote"><b>面试怎么答</b>' + n.interview + '</div>';
  document.getElementById('backBtn').onclick = showSummary;
  /* 高亮选中节点 */
  var nodes = document.querySelectorAll('#svg .node');
  nodes.forEach(function(g){
    g.classList.toggle('sel', g.getAttribute('data-id') === id);
  });
}

/* ================= Tab 事件 ================= */
document.querySelectorAll('#tabs .tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('#tabs .tab').forEach(function(x){x.classList.remove('on');});
    t.classList.add('on');
    renderDiagram(t.dataset.d);
  });
});

/* ================= 初始化 ================= */
renderDiagram('llm');
</script>
</body>
</html>
