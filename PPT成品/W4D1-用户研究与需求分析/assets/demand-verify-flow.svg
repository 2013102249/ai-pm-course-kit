<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="920" fill="#FFFFFF"/>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker>
  </defs>

  <!-- 标题 -->
  <rect x="48" y="34" width="4" height="22" fill="#7C3AED"/>
  <text x="62" y="52" font-size="20" font-weight="700" fill="#221E33">需求真伪判断流程图</text>
  <text x="62" y="76" font-size="12" fill="#6B7280">四问逐环判定 · 任一问不过即入右侧淘汰通道 · 教学示例：AI 菜谱（概括改写自往期学员案例）</text>

  <!-- 入口 -->
  <rect x="70" y="108" width="580" height="64" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="360" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">一条需求描述</text>
  <text x="360" y="158" text-anchor="middle" font-size="12" fill="#6B7280">例：「AI 帮我推荐今天做什么菜」</text>
  <line x1="360" y1="174" x2="360" y2="196" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- 第一问 -->
  <rect x="70" y="204" width="580" height="116" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="94" y="240" font-size="17" font-weight="700" fill="#221E33">① 痛点真不真</text>
  <text x="94" y="274" font-size="13" fill="#2563EB">判据：用户为这个问题做过什么努力？</text>
  <text x="94" y="302" font-size="12" fill="#6B7280">示例：用户以为的痛点是「不知道做什么菜」，实际留痕在别处</text>
  <line x1="360" y1="322" x2="360" y2="346" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- 第二问 -->
  <rect x="70" y="352" width="580" height="116" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="94" y="388" font-size="17" font-weight="700" fill="#221E33">② 场景有没有</text>
  <text x="94" y="422" font-size="13" fill="#2563EB">判据：最近一次发生在什么时候？频率多高？</text>
  <text x="94" y="450" font-size="12" fill="#6B7280">示例：真场景是饭点前面对冰箱剩余食材</text>
  <line x1="360" y1="470" x2="360" y2="494" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- 第三问 -->
  <rect x="70" y="500" width="580" height="116" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="94" y="536" font-size="17" font-weight="700" fill="#221E33">③ 现有方案是什么</text>
  <text x="94" y="570" font-size="13" fill="#2563EB">判据：Excel / 微信群 / 人肉 / 忍着，都算方案</text>
  <text x="94" y="598" font-size="12" fill="#6B7280">示例：现有方案是翻菜谱 App + 凭经验凑合</text>
  <line x1="360" y1="618" x2="360" y2="642" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- 第四问 -->
  <rect x="70" y="648" width="580" height="116" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="94" y="684" font-size="17" font-weight="700" fill="#221E33">④ 替换成本高不高</text>
  <text x="94" y="718" font-size="13" fill="#2563EB">判据：数据迁移 / 使用习惯 / 协作链 / 价格</text>
  <text x="94" y="746" font-size="12" fill="#6B7280">示例：重定义后「拍照管冰箱」几乎零迁移成本</text>
  <line x1="360" y1="766" x2="360" y2="788" stroke="#7C3AED" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- 通过出口 -->
  <rect x="70" y="792" width="580" height="76" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="360" y="824" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">通过：进入 KANO / RICE 排序</text>
  <text x="360" y="848" text-anchor="middle" font-size="12" fill="#221E33">KANO 定「做不做」，RICE 定「先做谁」</text>

  <!-- 淘汰通道 -->
  <rect x="700" y="204" width="430" height="560" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="915" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">淘汰通道（挂在第几问，记第几问）</text>

  <line x1="652" y1="262" x2="716" y2="262" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <rect x="724" y="240" width="382" height="44" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <text x="915" y="267" text-anchor="middle" font-size="13" fill="#6B7280">淘汰：无行为痕迹 → 假痛点</text>

  <line x1="652" y1="410" x2="716" y2="410" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <rect x="724" y="388" width="382" height="44" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <text x="915" y="415" text-anchor="middle" font-size="13" fill="#6B7280">淘汰：说不清最近一次 → 低频 / 漂浮概念</text>

  <line x1="652" y1="558" x2="716" y2="558" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <rect x="724" y="536" width="382" height="44" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <text x="915" y="563" text-anchor="middle" font-size="13" fill="#6B7280">淘汰：现有方案已足够好 → 好不足一个量级</text>

  <line x1="652" y1="706" x2="716" y2="706" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
  <rect x="724" y="684" width="382" height="44" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <text x="915" y="711" text-anchor="middle" font-size="13" fill="#6B7280">淘汰：换的麻烦大于忍的痛</text>

  <line x1="915" y1="766" x2="915" y2="788" stroke="#9CA3AF" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="700" y="792" width="430" height="76" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
  <text x="915" y="820" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">记入伪需求档案</text>
  <text x="915" y="842" text-anchor="middle" font-size="12" fill="#6B7280">写明挂在第几问 + 重定义方向</text>
  <text x="915" y="860" text-anchor="middle" font-size="11.5" fill="#9CA3AF">示例：原始菜谱需求挂在第①②问 → 重定义为「AI 管冰箱」</text>
</svg>
