<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="780" fill="#FFFFFF"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker>
<linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
</defs>
<rect x="20" y="24" width="4" height="22" fill="#7C3AED"/>
<text x="34" y="42" font-size="20" font-weight="700" fill="#221E33">三维定题交集图</text>
<text x="34" y="62" font-size="12" fill="#6B7280">行业 × 场景 × 人群 · 三环交集处才长出合格选题</text>
<!-- 三环 -->
<circle cx="320" cy="300" r="140" fill="#7C3AED" fill-opacity="0.10" stroke="#7C3AED" stroke-width="2.5"/>
<circle cx="530" cy="300" r="140" fill="#2563EB" fill-opacity="0.10" stroke="#2563EB" stroke-width="2.5"/>
<circle cx="425" cy="435" r="140" fill="#5B21B6" fill-opacity="0.08" stroke="url(#vg)" stroke-width="2.5"/>
<!-- 三环交集高亮 -->
<circle cx="425" cy="345" r="46" fill="#F1EBFD" stroke="#7C3AED" stroke-width="2"/>
<text x="425" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">合格选题</text>
<text x="425" y="362" text-anchor="middle" font-size="11" fill="#7C3AED">在这里长出来</text>
<!-- 环标签 -->
<text x="140" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">行业</text>
<text x="140" y="182" text-anchor="middle" font-size="12" fill="#4A4560">我懂的赛道（W1D5 已锁）</text>
<line x1="170" y1="195" x2="250" y2="238" stroke="#A5A1B8" stroke-width="1"/>
<text x="700" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">场景</text>
<text x="700" y="182" text-anchor="middle" font-size="12" fill="#4A4560">高频 · 具体 · 有痛点</text>
<line x1="688" y1="195" x2="605" y2="238" stroke="#A5A1B8" stroke-width="1"/>
<text x="425" y="635" text-anchor="middle" font-size="18" font-weight="700" fill="#5B21B6">人群</text>
<text x="425" y="657" text-anchor="middle" font-size="12" fill="#4A4560">可触达的一类人</text>
<line x1="425" y1="615" x2="425" y2="578" stroke="#A5A1B8" stroke-width="1"/>
<!-- 单环反例 -->
<text x="195" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">只有行业：</text>
<text x="195" y="428" text-anchor="middle" font-size="11" fill="#6B7280">换个热门方向跟风</text>
<line x1="215" y1="398" x2="258" y2="382" stroke="#A5A1B8" stroke-width="1"/>
<text x="690" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">只有场景：</text>
<text x="690" y="428" text-anchor="middle" font-size="11" fill="#6B7280">无人群的伪需求</text>
<line x1="655" y1="400" x2="608" y2="384" stroke="#A5A1B8" stroke-width="1"/>
<text x="245" y="525" text-anchor="middle" font-size="11" font-weight="700" fill="#6B7280">只有人群：</text>
<text x="245" y="543" text-anchor="middle" font-size="11" fill="#6B7280">泛需求做不深</text>
<line x1="290" y1="518" x2="340" y2="505" stroke="#A5A1B8" stroke-width="1"/>
<!-- 右侧收缩演示条 -->
<text x="1010" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#221E33">收缩演示：从万能到锁死</text>
<rect x="860" y="150" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
<text x="1010" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">万能 AI 助手</text>
<line x1="1010" y1="196" x2="1010" y2="242" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1024" y="224" font-size="11" fill="#2563EB">加限定词</text>
<rect x="860" y="248" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
<text x="1010" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">教育 AI 助手</text>
<line x1="1010" y1="294" x2="1010" y2="340" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1024" y="322" font-size="11" fill="#2563EB">加限定词</text>
<rect x="860" y="346" width="300" height="44" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
<text x="1010" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">招生答疑助手</text>
<line x1="1010" y1="392" x2="1010" y2="438" stroke="#A5A1B8" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="1024" y="420" font-size="11" fill="#2563EB">加限定词</text>
<rect x="860" y="444" width="300" height="74" rx="10" fill="#7C3AED"/>
<text x="1010" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">三线以下城市中小机构</text>
<text x="1010" y="496" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">招生答疑知识库（教学示例）</text>
<text x="40" y="740" font-size="14" font-weight="700" fill="#7C3AED">三环缺一环，选题就悬空——你的选题哪一环最虚？</text>
</svg>
