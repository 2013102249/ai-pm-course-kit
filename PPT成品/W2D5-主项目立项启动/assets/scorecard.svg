<text x="684" y="490" text-anchor="middle" font-size="10" fill="#6B7280">1</text>
<text x="781.5" y="490" text-anchor="middle" font-size="10" fill="#6B7280">2</text>
<text x="879" y="490" text-anchor="middle" font-size="10" fill="#6B7280">3</text>
<text x="976.5" y="490" text-anchor="middle" font-size="10" fill="#6B7280">4</text>
<text x="1074" y="490" text-anchor="middle" font-size="10" fill="#6B7280">5</text>
<!-- 及格线横条 -->
<rect x="30" y="580" width="1140" height="54" rx="12" fill="#7C3AED"/>
<text x="600" y="614" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">及格线：单维 ≥ 3 分，且总分 ≥ 12 / 20 —— 合规不过，直接换题</text>
<text x="600" y="668" text-anchor="middle" font-size="11" fill="#6B7280">示范：教育机构招生答疑知识库 → 技术 4 · 数据 4 · 合规 4 · 竞争 3 = 15 / 20（教学示例）</text>
</svg>
