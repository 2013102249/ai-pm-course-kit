<text x="391.5" y="250" text-anchor="middle" font-size="10" fill="#6B7280">4</text>
<text x="489" y="250" text-anchor="middle" font-size="10" fill="#6B7280">5</text>
<!-- 数据卡 -->
<rect x="615" y="100" width="555" height="210" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<text x="639" y="146" font-size="18" font-weight="700" fill="#221E33">数据</text>
<text x="639" y="176" font-size="13" fill="#4A4560">冷启动与持续数据能否低成本、合规地拿到？</text>
<text x="834" y="204" text-anchor="middle" font-size="10" fill="#DC2626">≥3 及格</text>
<line x1="834" y1="208" x2="834" y2="238" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="639" y="214" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
