<rect x="444" y="454" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
<text x="99" y="490" text-anchor="middle" font-size="10" fill="#6B7280">1</text>
<text x="196.5" y="490" text-anchor="middle" font-size="10" fill="#6B7280">2</text>
<text x="294" y="490" text-anchor="middle" font-size="10" fill="#6B7280">3</text>
<text x="391.5" y="490" text-anchor="middle" font-size="10" fill="#6B7280">4</text>
<text x="489" y="490" text-anchor="middle" font-size="10" fill="#6B7280">5</text>
<!-- 竞争卡 -->
<rect x="615" y="340" width="555" height="210" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<text x="639" y="386" font-size="18" font-weight="700" fill="#221E33">竞争</text>
<text x="639" y="416" font-size="13" fill="#4A4560">相比现有方案与竞品，是否有明确差异点？</text>
<text x="834" y="444" text-anchor="middle" font-size="10" fill="#DC2626">≥3 及格</text>
<line x1="834" y1="448" x2="834" y2="478" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="639" y="454" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
<rect x="736.5" y="454" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
