<rect x="931.5" y="214" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
<rect x="1029" y="214" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
<text x="684" y="250" text-anchor="middle" font-size="10" fill="#6B7280">1</text>
<text x="781.5" y="250" text-anchor="middle" font-size="10" fill="#6B7280">2</text>
<text x="879" y="250" text-anchor="middle" font-size="10" fill="#6B7280">3</text>
<text x="976.5" y="250" text-anchor="middle" font-size="10" fill="#6B7280">4</text>
<text x="1074" y="250" text-anchor="middle" font-size="10" fill="#6B7280">5</text>
<!-- 合规卡（硬门槛） -->
<rect x="30" y="340" width="555" height="210" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" stroke-dasharray="7,4"/>
<rect x="485" y="362" width="76" height="24" rx="12" fill="#DC2626"/>
<text x="523" y="379" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">硬门槛</text>
<text x="54" y="386" font-size="18" font-weight="700" fill="#221E33">合规</text>
<text x="54" y="416" font-size="13" fill="#4A4560">备案路径、数据边界、内容安全是否清晰可过？</text>
<text x="249" y="444" text-anchor="middle" font-size="10" fill="#DC2626">≥3 及格</text>
<line x1="249" y1="448" x2="249" y2="478" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="54" y="454" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
