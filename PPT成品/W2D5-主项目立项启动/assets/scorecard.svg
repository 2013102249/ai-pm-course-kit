<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="700" fill="#FFFFFF"/>
<rect x="20" y="24" width="4" height="22" fill="#7C3AED"/>
<text x="34" y="42" font-size="20" font-weight="700" fill="#221E33">四维评分卡示意</text>
<text x="34" y="62" font-size="12" fill="#6B7280">0–5 分打分 · 合规是硬门槛，不过必须换题</text>
<!-- 技术卡 -->
<rect x="30" y="100" width="555" height="210" rx="12" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<text x="54" y="146" font-size="18" font-weight="700" fill="#221E33">技术</text>
<text x="54" y="176" font-size="13" fill="#4A4560">现有模型能否稳定完成核心任务与关键步骤？</text>
<text x="249" y="204" text-anchor="middle" font-size="10" fill="#DC2626">≥3 及格</text>
<line x1="249" y1="208" x2="249" y2="238" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="54" y="214" width="90" height="16" rx="4" fill="#FAF9FE" stroke="#C9C2DE"/>
