<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"><rect width="1200" height="790" fill="#FFFFFF"/><defs><marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><rect x="48" y="38" width="4" height="22" fill="#7C3AED"/><text x="62" y="56" font-size="20" font-weight="700" fill="#221E33">AI PM 简历黄金结构</text><text x="62" y="76" font-size="12" fill="#6B7280">简历是给 HR 的 20 秒产品 · 五段占比按注意力权重着色，越深越先被看</text>

<text x="210" y="98" text-anchor="middle" font-size="11" fill="#9A94AE">（示意）</text><line x1="210" y1="110" x2="210" y2="726" stroke="#C9C2DE" stroke-width="2"/><line x1="200" y1="110" x2="220" y2="110" stroke="#A5A1B8" stroke-width="2"/><line x1="200" y1="264" x2="220" y2="264" stroke="#A5A1B8" stroke-width="2"/><line x1="200" y1="480" x2="220" y2="480" stroke="#A5A1B8" stroke-width="2"/><line x1="200" y1="726" x2="220" y2="726" stroke="#A5A1B8" stroke-width="2"/><text x="192" y="115" text-anchor="end" font-size="12" fill="#9A94AE">0 秒</text><text x="192" y="269" text-anchor="end" font-size="12" fill="#4A4560">定位 5 秒</text><text x="192" y="485" text-anchor="end" font-size="12" fill="#4A4560">技能与项目 12 秒</text><text x="192" y="731" text-anchor="end" font-size="12" fill="#4A4560">其余 3 秒</text>

<rect x="420" y="110" width="380" height="60" fill="#7C3AED"/><text x="440" y="136" font-size="15" font-weight="700" fill="#FFFFFF">头部：一句话定位</text><text x="780" y="136" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">约 10%</text><text x="440" y="158" font-size="11.5" fill="#FFFFFF">一行写清：什么人 + 能干什么 + 干成过什么</text>

<rect x="420" y="174" width="380" height="90" fill="#7C3AED" fill-opacity="0.85"/><text x="440" y="202" font-size="15" font-weight="700" fill="#FFFFFF">核心技能</text><text x="780" y="202" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">约 15%</text><text x="440" y="226" font-size="11.5" fill="#FFFFFF">4–6 条；从目标 JD 提取关键词；</text><text x="440" y="248" font-size="11.5" fill="#FFFFFF">每条挂一个事实</text>

<rect x="420" y="268" width="380" height="240" fill="#2563EB"/><text x="440" y="300" font-size="16" font-weight="700" fill="#FFFFFF">项目经历（黄金位）</text><text x="780" y="300" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">约 40%</text><text x="440" y="334" font-size="12.5" fill="#FFFFFF">主项目放最前</text><rect x="440" y="350" width="340" height="76" rx="8" fill="#FFFFFF" fill-opacity="0.16"/><text x="456" y="382" font-size="13.5" font-weight="700" fill="#FFFFFF">公式 = 背景一句 + 动作两条</text><text x="456" y="408" font-size="13.5" font-weight="700" fill="#FFFFFF">+ 数据结果一条</text>

<rect x="420" y="512" width="380" height="150" fill="#2563EB" fill-opacity="0.6"/><text x="440" y="542" font-size="15" font-weight="700" fill="#FFFFFF">工作经历（倒叙）</text><text x="780" y="542" text-anchor="end" font-size="12" fill="#FFFFFF" opacity="0.85">约 25%</text><text x="440" y="570" font-size="11.5" fill="#FFFFFF">最近在前</text><text x="440" y="594" font-size="11.5" fill="#FFFFFF">每条回答：为什么让我更适合做 AI PM</text>

<rect x="420" y="666" width="380" height="60" fill="#E8E5F1"/><text x="440" y="690" font-size="15" font-weight="700" fill="#4A4560">教育背景</text><text x="780" y="690" text-anchor="end" font-size="12" fill="#6B7280">约 10%</text><text x="440" y="712" font-size="11.5" fill="#6B7280">一行到两行；精简；放最后</text>

<line x1="850" y1="140" x2="850" y2="700" stroke="#E8E5F1" stroke-width="1"/><text x="860" y="128" font-size="14" font-weight="700" fill="#7C3AED">HR 视线 20 秒</text><path d="M 855 145 C 940 165, 960 260, 985 380 C 1000 450, 1000 560, 1040 660" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrC)"/><text x="860" y="722" font-size="12" fill="#6B7280">首屏 1/3 决定生死</text>

<text x="48" y="768" font-size="11" fill="#9A94AE">W7D3 配图 V1.0</text><text x="1152" y="768" text-anchor="end" font-size="11" fill="#9A94AE">新像素教育 · 课程自研素材</text></svg>
