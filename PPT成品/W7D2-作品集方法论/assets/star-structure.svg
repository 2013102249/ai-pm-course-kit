<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"><rect width="1200" height="640" fill="#FFFFFF"/><rect x="48" y="38" width="4" height="22" fill="#7C3AED"/><text x="62" y="56" font-size="20" font-weight="700" fill="#221E33">STAR 结构图</text><text x="62" y="76" font-size="12" fill="#6B7280">复盘文档四字母公式 · 正反例对照，反例先讲，正例收尾</text>

<rect x="48" y="96" width="258" height="190" rx="16" fill="#7C3AED"/><rect x="48" y="270" width="258" height="16" fill="#7C3AED"/><rect x="48" y="96" width="258" height="480" rx="16" fill="none" stroke="#C9C2DE" stroke-width="1.4"/><text x="177" y="182" text-anchor="middle" font-size="64" font-weight="700" fill="#FFFFFF">S</text><text x="177" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">S · 一句话背景</text><text x="177" y="254" text-anchor="middle" font-size="13.5" fill="#FFFFFF" opacity="0.95">行业+场景+核心矛盾，≤40 字</text><rect x="62" y="316" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="62" y="316" width="4" height="110" rx="2" fill="#059669"/><circle cx="84" cy="338" r="9" fill="#059669"/><text x="84" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text><text x="100" y="342" font-size="11" font-weight="700" fill="#059669">正例</text><text x="78" y="372" font-size="13" fill="#221E33">咨询量 200 条/天，60% 重复，</text><text x="78" y="394" font-size="13" fill="#221E33">人工响应超 4 小时</text><rect x="62" y="442" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="62" y="442" width="4" height="110" rx="2" fill="#DC2626"/><circle cx="84" cy="464" r="9" fill="#DC2626"/><text x="84" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">×</text><text x="100" y="468" font-size="11" font-weight="700" fill="#DC2626">反例</text><text x="78" y="498" font-size="13" fill="#221E33">近年来 AI 发展迅速，各行各业</text><text x="78" y="520" font-size="13" fill="#221E33">积极探索应用……</text>

<rect x="330" y="96" width="258" height="190" rx="16" fill="#2563EB"/><rect x="330" y="270" width="258" height="16" fill="#2563EB"/><rect x="330" y="96" width="258" height="480" rx="16" fill="none" stroke="#C9C2DE" stroke-width="1.4"/><text x="459" y="182" text-anchor="middle" font-size="64" font-weight="700" fill="#FFFFFF">T</text><text x="459" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">T · 可量化目标</text><text x="459" y="254" text-anchor="middle" font-size="13.5" fill="#FFFFFF" opacity="0.95">范围/规模/周期/指标至少占两样</text><rect x="344" y="316" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="344" y="316" width="4" height="110" rx="2" fill="#059669"/><circle cx="366" cy="338" r="9" fill="#059669"/><text x="366" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text><text x="382" y="342" font-size="11" font-weight="700" fill="#059669">正例</text><text x="360" y="372" font-size="13" fill="#221E33">从 0 到 1 主导 8 周上线，</text><text x="360" y="394" font-size="13" fill="#221E33">目标正确率 85%+</text><rect x="344" y="442" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="344" y="442" width="4" height="110" rx="2" fill="#DC2626"/><circle cx="366" cy="464" r="9" fill="#DC2626"/><text x="366" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">×</text><text x="382" y="468" font-size="11" font-weight="700" fill="#DC2626">反例</text><text x="360" y="498" font-size="13" fill="#221E33">负责知识库产品。</text>

<rect x="612" y="96" width="258" height="190" rx="16" fill="#7C3AED"/><rect x="612" y="270" width="258" height="16" fill="#7C3AED"/><rect x="612" y="96" width="258" height="480" rx="16" fill="none" stroke="#C9C2DE" stroke-width="1.4"/><text x="741" y="182" text-anchor="middle" font-size="64" font-weight="700" fill="#FFFFFF">A</text><text x="741" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">A · 写决策</text><text x="741" y="254" text-anchor="middle" font-size="13.5" fill="#FFFFFF" opacity="0.95">为什么这么做，放弃了什么</text><rect x="626" y="316" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="626" y="316" width="4" height="110" rx="2" fill="#059669"/><circle cx="648" cy="338" r="9" fill="#059669"/><text x="648" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text><text x="664" y="342" font-size="11" font-weight="700" fill="#059669">正例</text><text x="642" y="372" font-size="13" fill="#221E33">访谈推翻原假设，放弃换模型，</text><text x="642" y="394" font-size="13" fill="#221E33">改做分块+重排</text><rect x="626" y="442" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="626" y="442" width="4" height="110" rx="2" fill="#DC2626"/><circle cx="648" cy="464" r="9" fill="#DC2626"/><text x="648" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">×</text><text x="664" y="468" font-size="11" font-weight="700" fill="#DC2626">反例</text><text x="642" y="498" font-size="13" fill="#221E33">负责需求调研、PRD 撰写、</text><text x="642" y="520" font-size="13" fill="#221E33">开发跟进、测试验收。</text>

<rect x="894" y="96" width="258" height="190" rx="16" fill="#2563EB"/><rect x="894" y="270" width="258" height="16" fill="#2563EB"/><rect x="894" y="96" width="258" height="480" rx="16" fill="none" stroke="#C9C2DE" stroke-width="1.4"/><text x="1023" y="182" text-anchor="middle" font-size="64" font-weight="700" fill="#FFFFFF">R</text><text x="1023" y="222" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">R · 必须有数字</text><text x="1023" y="254" text-anchor="middle" font-size="13.5" fill="#FFFFFF" opacity="0.95">基准值→结果值+时间范围</text><rect x="908" y="316" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="908" y="316" width="4" height="110" rx="2" fill="#059669"/><circle cx="930" cy="338" r="9" fill="#059669"/><text x="930" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">✓</text><text x="946" y="342" font-size="11" font-weight="700" fill="#059669">正例</text><text x="924" y="372" font-size="13" fill="#221E33">引用正确率从 71% 提升至 90%</text><text x="924" y="394" font-size="13" fill="#221E33">（上线两周）</text><rect x="908" y="442" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1.2"/><rect x="908" y="442" width="4" height="110" rx="2" fill="#DC2626"/><circle cx="930" cy="464" r="9" fill="#DC2626"/><text x="930" y="468" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">×</text><text x="946" y="468" font-size="11" font-weight="700" fill="#DC2626">反例</text><text x="924" y="498" font-size="13" fill="#221E33">产品效果显著，广受用户好评。</text>

<text x="1152" y="614" text-anchor="end" font-size="11" fill="#7A7590">示例数字均为教学示例</text></svg>
