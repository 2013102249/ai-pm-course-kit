<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arwP" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arwBl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <rect x="30" y="36" width="4" height="22" fill="#7C3AED"/>
  <text x="42" y="54" font-size="20" font-weight="700" fill="#221E33">测试验收流程图</text>
  <text x="42" y="76" font-size="12" fill="#6B7280">badcase 闭环 · 归因 → 修复 → 回归 · W6D4</text>

  <!-- 右上角数字徽章 -->
  <rect x="706" y="38" width="120" height="36" rx="8" fill="#2563EB"/>
  <text x="766" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">评测集 ≥50 条</text>
  <rect x="838" y="38" width="170" height="36" rx="8" fill="#2563EB"/>
  <text x="923" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">badcase 率 30% 警戒线</text>
  <rect x="1020" y="38" width="150" height="36" rx="8" fill="#2563EB"/>
  <text x="1095" y="61" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">通过率 ≥90% 且无 P0</text>

  <!-- 闭环回归虚线（蓝） -->
  <path d="M1020,128 L1020,98 L180,98 L180,120" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arwBl)"/>
  <rect x="480" y="86" width="240" height="20" fill="#FFFFFF"/>
  <text x="600" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563EB">回归通过 → 回到评测集（跑分）</text>

  <!-- 主流程四节点 -->
  <rect x="80" y="128" width="200" height="84" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="180" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">① badcase 收集</text>
  <text x="180" y="192" text-anchor="middle" font-size="11" fill="#6B7280">兜住每一个 badcase</text>
  <rect x="360" y="128" width="200" height="84" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="460" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">② 归因</text>
  <text x="460" y="192" text-anchor="middle" font-size="11" fill="#6B7280">给它定罪</text>
  <rect x="640" y="128" width="200" height="84" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="740" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">③ 修复</text>
  <text x="740" y="192" text-anchor="middle" font-size="11" fill="#6B7280">对症下药</text>
  <rect x="920" y="128" width="200" height="84" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="1020" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">④ 回归测试</text>
  <text x="1020" y="192" text-anchor="middle" font-size="11" fill="#6B7280">证明药有效</text>

  <path d="M280,170 L352,170" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arwP)"/>
  <path d="M560,170 L632,170" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arwP)"/>
  <path d="M840,170 L912,170" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arwP)"/>

  <!-- 归因分支连接线（蓝） -->
  <path d="M460,212 L460,232" fill="none" stroke="#2563EB" stroke-width="1.6"/>
  <line x1="201" y1="232" x2="999" y2="232" stroke="#2563EB" stroke-width="1.6"/>
  <path d="M201,232 L201,238" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arwBl)"/>
  <path d="M467,232 L467,238" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arwBl)"/>
  <path d="M733,232 L733,238" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arwBl)"/>
  <path d="M999,232 L999,238" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arwBl)"/>

  <!-- 归因分支四卡片 -->
  <rect x="80" y="244" width="242" height="260" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="201" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">解析问题</text>
  <line x1="96" y1="294" x2="306" y2="294" stroke="#E8EFFD" stroke-width="1.2"/>
  <text x="201" y="322" text-anchor="middle" font-size="12.5" fill="#4A4560">引用原文错：</text>
  <text x="201" y="344" text-anchor="middle" font-size="12.5" fill="#4A4560">乱码 / 表格错位</text>
  <rect x="238" y="460" width="72" height="26" rx="13" fill="#E8EFFD"/>
  <text x="274" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">数据工程</text>

  <rect x="346" y="244" width="242" height="260" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="467" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">分块问题</text>
  <line x1="362" y1="294" x2="572" y2="294" stroke="#E8EFFD" stroke-width="1.2"/>
  <text x="467" y="322" text-anchor="middle" font-size="12.5" fill="#4A4560">答案被切断，</text>
  <text x="467" y="344" text-anchor="middle" font-size="12.5" fill="#4A4560">主题被稀释</text>
  <rect x="504" y="460" width="72" height="26" rx="13" fill="#E8EFFD"/>
  <text x="540" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">算法工程</text>

  <rect x="612" y="244" width="242" height="260" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="733" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">检索问题</text>
  <line x1="628" y1="294" x2="838" y2="294" stroke="#E8EFFD" stroke-width="1.2"/>
  <text x="733" y="322" text-anchor="middle" font-size="12.5" fill="#4A4560">资料里有，</text>
  <text x="733" y="344" text-anchor="middle" font-size="12.5" fill="#4A4560">却没捞到</text>
  <rect x="770" y="460" width="72" height="26" rx="13" fill="#E8EFFD"/>
  <text x="806" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">算法</text>

  <rect x="878" y="244" width="242" height="260" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.6"/>
  <text x="999" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">生成问题</text>
  <line x1="894" y1="294" x2="1104" y2="294" stroke="#E8EFFD" stroke-width="1.2"/>
  <text x="999" y="322" text-anchor="middle" font-size="12.5" fill="#4A4560">好资料仍编造，</text>
  <text x="999" y="344" text-anchor="middle" font-size="12.5" fill="#4A4560">格式错误</text>
  <rect x="1036" y="460" width="72" height="26" rx="13" fill="#E8EFFD"/>
  <text x="1072" y="478" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">算法产品</text>

  <!-- 纪律条 -->
  <rect x="30" y="544" width="1140" height="60" rx="10" fill="#7C3AED"/>
  <text x="600" y="581" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">无归因不派单 · 先数据后模型 · 先便宜后贵</text>

  <text x="600" y="646" text-anchor="middle" font-size="12" fill="#6B7280">闭环提醒：回归不通过则继续修复；修复不回归 = 没修</text>
</svg>
