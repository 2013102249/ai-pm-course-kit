<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="760" fill="#FFFFFF"/>
<rect x="20" y="24" width="4" height="22" fill="#7C3AED"/>
<text x="34" y="42" font-size="20" font-weight="700" fill="#221E33">微调必要性五问判断卡</text>
<text x="34" y="62" font-size="12" fill="#6B7280">遇到「要不要微调」时逐问过 · 五问措辞与教案、讲课稿、导学案一致</text>
<rect x="300" y="96" width="600" height="540" rx="14" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.5"/>
<!-- 问1 -->
<circle cx="352" cy="146" r="17" fill="#7C3AED"/>
<text x="352" y="152" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
<text x="386" y="142" font-size="17" font-weight="700" fill="#7C3AED">三种以上提示词结构都试过、仍未达标吗？</text>
<text x="386" y="170" font-size="13" fill="#2563EB">考察点：先穷尽提示工程与外挂资料</text>
<line x1="330" y1="204" x2="870" y2="204" stroke="#E8E5F1" stroke-dasharray="4,3"/>
<!-- 问2 -->
<circle cx="352" cy="246" r="17" fill="#7C3AED"/>
<text x="352" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
<text x="386" y="242" font-size="17" font-weight="700" fill="#7C3AED">缺的是知识，还是能力？</text>
<text x="386" y="270" font-size="13" fill="#2563EB">考察点：缺知识优先 RAG，缺能力才谈微调</text>
<line x1="330" y1="304" x2="870" y2="304" stroke="#E8E5F1" stroke-dasharray="4,3"/>
<!-- 问3 -->
<circle cx="352" cy="346" r="17" fill="#7C3AED"/>
<text x="352" y="352" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<text x="386" y="342" font-size="17" font-weight="700" fill="#7C3AED">能稳定收集数百条高质量示范数据吗？</text>
<text x="386" y="370" font-size="13" fill="#2563EB">考察点：没有数据，就没有 SFT</text>
<line x1="330" y1="404" x2="870" y2="404" stroke="#E8E5F1" stroke-dasharray="4,3"/>
<!-- 问4 -->
<circle cx="352" cy="446" r="17" fill="#7C3AED"/>
<text x="352" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
<text x="386" y="442" font-size="17" font-weight="700" fill="#7C3AED">需求会不会三个月后就变？</text>
<text x="386" y="470" font-size="13" fill="#2563EB">考察点：需求频繁变，微调资产贬值快</text>
<line x1="330" y1="504" x2="870" y2="504" stroke="#E8E5F1" stroke-dasharray="4,3"/>
<!-- 问5 -->
<circle cx="352" cy="546" r="17" fill="#7C3AED"/>
<text x="352" y="552" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
<text x="386" y="542" font-size="17" font-weight="700" fill="#7C3AED">有没有评测集能证明微调真的有效？</text>
<text x="386" y="570" font-size="13" fill="#2563EB">考察点：没有评测，就无法验收微调效果</text>
<!-- 结论条 -->
<rect x="300" y="656" width="600" height="52" rx="12" fill="#7C3AED"/>
<text x="600" y="690" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">任何一问不过 = 不该微调</text>
<text x="600" y="740" text-anchor="middle" font-size="11" fill="#A5A1B8">AI 产品经理就业训练营 · W2D2</text>
</svg>
