<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif"><rect width="1200" height="760" fill="#FFFFFF"/><rect x="48" y="38" width="4" height="22" fill="#7C3AED"/><text x="62" y="56" font-size="20" font-weight="700" fill="#221E33">渠道对比表</text><text x="62" y="76" font-size="12" fill="#6B7280">五类渠道定性对比 · 响应率均为定性描述，不设平台百分比，要建立自己的数据</text>

<rect x="48" y="104" width="1104" height="46" fill="#7C3AED"/><text x="163" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">渠道</text><text x="383" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">适合谁</text><text x="633" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">响应率特点（定性）</text><text x="965" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">使用要点</text>

<rect x="48" y="150" width="1104" height="90" fill="#F1EBFD"/><rect x="48" y="150" width="4" height="90" fill="#7C3AED"/><text x="68" y="188" font-size="16" font-weight="700" fill="#221E33">内推</text><rect x="68" y="202" width="78" height="22" rx="11" fill="#7C3AED"/><text x="107" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">优先级 1</text><text x="298" y="202" font-size="14" fill="#4A4560">所有学员，转行者尤其依赖</text><text x="508" y="202" font-size="14" fill="#4A4560"><tspan font-weight="700" fill="#2563EB">最高</tspan>——有人背书，可绕过机器初筛</text><text x="798" y="202" font-size="14" fill="#4A4560">推得具体：匹配点三句话 + 推荐语 + 跟进到 HR</text>

<rect x="48" y="240" width="1104" height="90" fill="#FFFFFF"/><text x="68" y="278" font-size="16" font-weight="700" fill="#221E33">猎头</text><rect x="68" y="292" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="107" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">优先级 2</text><text x="298" y="292" font-size="14" fill="#4A4560">3 年以上经验 / 稀缺背景</text><text x="508" y="292" font-size="14" fill="#4A4560"><tspan font-weight="700" fill="#2563EB">较高</tspan>——只对「好卖」的简历敏感</text><text x="798" y="292" font-size="14" fill="#4A4560">主动加 2–3 位 AI 赛道猎头；写清在职状态与期望薪资</text>

<rect x="48" y="330" width="1104" height="90" fill="#F7F6FB"/><text x="68" y="368" font-size="16" font-weight="700" fill="#221E33">BOSS 直聘</text><rect x="68" y="382" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="107" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">优先级 3</text><text x="298" y="382" font-size="14" fill="#4A4560">全员主战场</text><text x="508" y="382" font-size="14" fill="#4A4560"><tspan font-weight="700" fill="#2563EB">中等</tspan>——话术质量决定响应</text><text x="798" y="382" font-size="14" fill="#4A4560">每条话术三件套定制；工作日白天沟通；固定投递时段</text>

<rect x="48" y="420" width="1104" height="90" fill="#FFFFFF"/><text x="68" y="458" font-size="16" font-weight="700" fill="#221E33">猎聘</text><rect x="68" y="472" width="78" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="107" y="487" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">优先级 3</text><text x="298" y="458" font-size="14" fill="#4A4560">冲中高级 / 大厂</text><text x="508" y="458" font-size="14" fill="#4A4560"><tspan font-weight="700" fill="#2563EB">中等</tspan>——岗位池偏中高级</text><text x="798" y="458" font-size="14" fill="#4A4560">精选高匹配岗位；完善关键词提高被搜索命中</text>

<rect x="48" y="510" width="1104" height="90" fill="#F7F6FB"/><text x="68" y="548" font-size="16" font-weight="700" fill="#221E33">脉脉</text><rect x="68" y="562" width="110" height="22" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/><text x="123" y="577" text-anchor="middle" font-size="11" font-weight="700" fill="#7C3AED">优先级 4 · 情报</text><text x="298" y="548" font-size="14" fill="#4A4560">全员</text><text x="508" y="548" font-size="14" fill="#4A4560"><tspan font-weight="700" fill="#2563EB">间接</tspan>——不直接产生投递</text><text x="798" y="548" font-size="14" fill="#4A4560">找人 / 查口碑 / 约 coffee chat；主页按公开简历打理</text>

<line x1="278" y1="104" x2="278" y2="600" stroke="#E8E5F1" stroke-width="1"/><line x1="488" y1="104" x2="488" y2="600" stroke="#E8E5F1" stroke-width="1"/><line x1="778" y1="104" x2="778" y2="600" stroke="#E8E5F1" stroke-width="1"/><line x1="48" y1="150" x2="1152" y2="150" stroke="#E8E5F1" stroke-width="1"/><line x1="48" y1="240" x2="1152" y2="240" stroke="#E8E5F1" stroke-width="1"/><line x1="48" y1="330" x2="1152" y2="330" stroke="#E8E5F1" stroke-width="1"/><line x1="48" y1="420" x2="1152" y2="420" stroke="#E8E5F1" stroke-width="1"/><line x1="48" y1="510" x2="1152" y2="510" stroke="#E8E5F1" stroke-width="1"/><rect x="48" y="104" width="1104" height="496" rx="2" fill="none" stroke="#C9C2DE" stroke-width="1.4"/>

<rect x="48" y="622" width="1104" height="42" rx="8" fill="#F1F0F5" stroke="#C9C2DE" stroke-width="1.2" stroke-dasharray="4 3"/><text x="600" y="649" text-anchor="middle" font-size="14" fill="#6B7280">海投（群发同款话术）：响应率最低，仅作对照实验，不作为策略</text>

<rect x="48" y="682" width="1104" height="48" rx="10" fill="#2563EB"/><text x="600" y="713" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">内推 &gt; 猎头 &gt; 精准直投 &gt; 海投；脉脉做情报，不为投而投</text></svg>
