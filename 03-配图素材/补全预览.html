var GROUPS=[
  {key:'week',box:'week-chips',values:['全部','W1','W2','W3','W4','W5','W6','W7','W8']},
  {key:'kind',box:'kind-chips',values:['全部','术语卡','独立图','追问卡']}
];
var state={week:'全部',kind:'全部',q:''};
GROUPS.forEach(function(g){
  var box=document.getElementById(g.box);
  g.values.forEach(function(v){
    var b=document.createElement('button');
    b.type='button';b.className='chip';b.textContent=v;
    b.dataset.group=g.key;b.dataset.val=v;
    b.title=(v==='全部'?'显示所有素材':'再点一次取消选择');
    b.onclick=function(){
      state[g.key]=(v==='全部'||state[g.key]===v)?'全部':v;
      render();
    };
    box.appendChild(b);
  });
});
function render(){
  var all=document.querySelectorAll('.chip');
  for(var i=0;i<all.length;i++){
    var c=all[i],on=(c.dataset.val===state[c.dataset.group]);
    c.classList.toggle('on',on);
    c.setAttribute('aria-pressed',on?'true':'false');
  }
  var q=state.q;
  var out=DATA.filter(function(o){
    return (state.week==='全部'||o.ws.indexOf(state.week)>=0)
        && (state.kind==='全部'||o.k===state.kind)
        && (!q||o.t.toLowerCase().indexOf(q)>=0);
  });
  var cond=['周次：'+(state.week==='全部'?'全部':state.week),
            '类型：'+(state.kind==='全部'?'全部':state.kind)];
  if(q)cond.push('关键词：「'+q+'」');

    '</b> ｜ 命中 <b>'+out.length+'</b> / '+DATA.length+' 张';
  var g=document.getElementById('grid');
  if(!out.length){g.innerHTML='<div class="empty">没有匹配的素材；再点一次已选按钮，或点「清空筛选」即可取消选择</div>';return;}
  g.innerHTML=out.map(function(o){
    var wt=(o.ws.length>=8)?'跨周共享':o.ws.join(' · ');
    return '<div class="card"><div class="thumb"><img loading="lazy" src="'+o.p+'" alt="'+o.t+'"></div>'+
    '<div class="cap">'+o.t+'</div><div class="tag">'+o.k+' · '+wt+'</div>'+
    '<a class="dl" href="'+o.p+'" target="_blank">打开原图 ↗</a></div>';
  }).join('');
}
document.getElementById('q').oninput=function(e){state.q=e.target.value.trim().toLowerCase();render();};
document.getElementById('reset').onclick=function(){
  state.week='全部';state.kind='全部';state.q='';
  document.getElementById('q').value='';render();
};
render();
