<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最易与「面试官评分」混。自评是学员自己填、用来定位薄弱项</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">；面试官评分是外部定档，当场不公布总分。两者不一致处，正</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">是复盘最该看的地方。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
