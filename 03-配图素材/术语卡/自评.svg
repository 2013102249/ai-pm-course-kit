<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">像考完先自己估分：哪几题稳、哪几题悬，心里有数再对答案</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">，才知道该补哪块。</text>
