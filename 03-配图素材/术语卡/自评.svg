<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「我给自己内容档打中段，因为追问两层后有个数据没给来源</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">。」</text>
