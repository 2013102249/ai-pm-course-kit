<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#F8F8FC"/>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="140" fill="url(#hd)"/>
<rect x="50" y="34" width="6" height="72" rx="3" fill="#FFFFFF" opacity="0.9"/>
<text x="78" y="76" font-size="40" font-weight="700" fill="#FFFFFF">概率续写</text>
<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">W1D2 · 术语类比卡 · 第 19 张</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="15" fill="#FFFFFF" text-anchor="middle">AI PM 八周训练营</text>
<rect x="50" y="168" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="168" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="195" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="208" font-size="21" font-weight="700" fill="#221E33">一句话定义</text>
<line x1="78" y1="226" x2="578" y2="226" stroke="#E5E7EB"/>
<text x="78" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">根据前文猜下一个最像的词往外接。</text>
<rect x="614" y="168" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="168" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">就是饭桌上的「接话」和「成语接龙」。你说「今天天气」，</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">他顺口接「真好」；你说「鹅鹅鹅」，他接「曲项向天歌」。</text>
<text x="642" y="320.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">他不是去书架上翻原文，是脑子里「最像的下一句」自己冒出</text>
<text x="642" y="350.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">来了，一个词一个词往外冒。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最容易混的是把它当成「查资料 / 检索」。概率续写是「猜」</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">，不是「翻库取标准答案」；所以同一句问两遍，答案可能不一</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">样——这不是不稳定，是它每次都现场接着说。第二个坑：把它说</text>
<text x="78" y="652.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">成「随机乱猜」——不是乱猜，是「最像的那个」，所以它编出来</text>
<text x="78" y="682.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">的东西才那么像真的。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「大模型底层动作是概率续写，根据前文猜下一个最像的词；</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">这解释了它为什么永远会接话、也为什么同一问题两遍答案会</text>
<text x="642" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">不同。」</text>
<line x1="50" y1="752" x2="1150" y2="752" stroke="#E5E7EB"/><text x="50" y="780" font-size="13" fill="#7A7590">03-配图素材/术语卡/08-概率续写.svg</text><text x="1150" y="780" font-size="13" fill="#7A7590" text-anchor="end">内容源自 02-讲课稿 · 共 420 张</text>
</svg>
