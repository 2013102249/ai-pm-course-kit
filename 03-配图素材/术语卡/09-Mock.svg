<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#F8F8FC"/>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="140" fill="url(#hd)"/>
<rect x="50" y="34" width="6" height="72" rx="3" fill="#FFFFFF" opacity="0.9"/>
<text x="78" y="76" font-size="40" font-weight="700" fill="#FFFFFF">Mock</text>
<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">W6D2 · 术语类比卡 · 第 278 张</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="15" fill="#FFFFFF" text-anchor="middle">AI PM 八周训练营</text>
<rect x="50" y="168" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="168" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="195" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="208" font-size="21" font-weight="700" fill="#221E33">一句话定义</text>
<line x1="78" y1="226" x2="578" y2="226" stroke="#E5E7EB"/>
<text x="78" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">开发期先顶真数据的样品，验收要换回真的。</text>
<rect x="614" y="168" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="168" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">消防演习用烟雾弹代替真火，模特穿样衣走彩排——东西是替身</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">，但走位、流程、口令全都照正式来一遍。等正式营业，真菜</text>
<text x="642" y="320.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">必须真上。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最容易混的是把它当成「糊弄 / 造假」或「跑通了」。Mock </text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">是开发期为了让流程先转起来的替身，是正当工具；但验收口径</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">里写死假数据一律不算跑通——这正是原版宣讲里那句「输出要是</text>
<text x="78" y="652.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">模型真实返回的结果，不要前端写死的一段假数据」。第二个坑</text>
<text x="78" y="682.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">：把 Mock 当成降级手段，兜底时拿假数据冒充真实结果给用</text>
<text x="78" y="712.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">户。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「Mock 是开发期替身，用来先跑通流程；但验收标准里我写</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">死『必须换回真实调用』，写死假数据不算通，更不能拿它冒</text>
<text x="642" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">充降级结果。」</text>
<line x1="50" y1="752" x2="1150" y2="752" stroke="#E5E7EB"/><text x="50" y="780" font-size="13" fill="#7A7590">03-配图素材/术语卡/09-Mock.svg</text><text x="1150" y="780" font-size="13" fill="#7A7590" text-anchor="end">内容源自 02-讲课稿 · 共 420 张</text>
</svg>
