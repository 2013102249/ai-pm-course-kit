<text x="666" y="208" font-size="21" font-weight="700" fill="#111827">生活类比</text>
<line x1="642" y1="226" x2="1122" y2="226" stroke="#E5E7EB"/>
<text x="644" y="260" font-size="18.5" fill="#374151">驾校科目考试——路线、扣分点、及格线都提前公布</text>
<text x="644" y="290" font-size="18.5" fill="#374151">，谁考都一样；没有固定考卷的验收等于开盲盒。</text>
