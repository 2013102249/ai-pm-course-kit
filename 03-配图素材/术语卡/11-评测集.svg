<text x="102" y="208" font-size="21" font-weight="700" fill="#111827">一句话定义</text>
<line x1="78" y1="226" x2="572" y2="226" stroke="#E5E7EB"/>
<text x="80" y="260" font-size="18.5" fill="#374151">题目、标准答案、打分标准都提前写死的一套测试用例</text>
<text x="80" y="290" font-size="18.5" fill="#374151">；可反复重跑，用来回答「它到底行不行」。</text>
