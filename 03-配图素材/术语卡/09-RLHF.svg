<text x="50" y="790" font-size="13" fill="#6B7280">AI 产品经理就业训练营 · 术语类比卡</text>
<text x="1150" y="790" font-size="13" fill="#6B7280" text-anchor="end">紫 #7C3AED / 蓝 #2563EB · 术语来源：课程既有内容</text>
