<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#F8F8FC"/>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="140" fill="url(#hd)"/>
<rect x="50" y="34" width="6" height="72" rx="3" fill="#FFFFFF" opacity="0.9"/>
<text x="78" y="76" font-size="40" font-weight="700" fill="#FFFFFF">幻觉</text>
<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">W1D2 · 术语类比卡 · 第 18 张</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="15" fill="#FFFFFF" text-anchor="middle">AI PM 八周训练营</text>
<rect x="50" y="168" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="168" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="195" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="208" font-size="21" font-weight="700" fill="#221E33">一句话定义</text>
<line x1="78" y1="226" x2="578" y2="226" stroke="#E5E7EB"/>
<text x="78" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">没见过也自信地编一个像真的答案。</text>
<rect x="614" y="168" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="168" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">像单位里一位特别爱面子、从不肯说「不知道」的老同事。你</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">问他一件他压根没听过的事，他不红脸、不卡壳，反而笑眯眯</text>
<text x="642" y="320.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">地给你一个听起来头头是道的说法，还带细节。你差点就信了</text>
<text x="642" y="350.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">——回头一查，是他凭印象拼的。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最容易混的是把它当成「答错了 / 程序坏了」。答错是知道答</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">案却算岔了，幻觉是根本没见过却接了一个最像的；它不是故障</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">，是「接话」这套本性的副产品。第二个坑：以为「多喂点数据</text>
<text x="78" y="652.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">」就能根治——防它主要靠产品设计（先给资料、关键数字回原文</text>
<text x="78" y="682.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">核对、输出过滤），不靠许愿。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「幻觉不是缺陷，是本能——训练全程只奖励『接得像』，从没</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">教过『不知道就说不知道』；防幻觉靠产品设计，不靠许愿。</text>
<text x="642" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">」</text>
<line x1="50" y1="752" x2="1150" y2="752" stroke="#E5E7EB"/><text x="50" y="780" font-size="13" fill="#7A7590">03-配图素材/术语卡/07-幻觉.svg</text><text x="1150" y="780" font-size="13" fill="#7A7590" text-anchor="end">内容源自 02-讲课稿 · 共 420 张</text>
</svg>
