<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">像开饭馆先办执照、把执照挂墙上，客人进门能看见你「有证</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">经营」。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最易和「大模型备案」「应用登记」混成一团——这三者是不同动</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">作、面向不同对象，绝不是「备一次全搞定」；今天专门用一张</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">对比表拆开。具体适用与办理，以现行法规与法务意见为准。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「备案不是产品经理拍板下结论的事，我会把它列成待法务确</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">认项，并去官网 / 应用商店核对公示信息。」</text>
