<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="16" fill="#FFFFFF" text-anchor="middle">W3D3 RAG 架构与知识库产品</text>
