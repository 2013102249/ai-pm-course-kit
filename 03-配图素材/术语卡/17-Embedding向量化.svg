<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#111827">生活类比</text>
<line x1="642" y1="226" x2="1122" y2="226" stroke="#E5E7EB"/>
<text x="644" y="260" font-size="18.5" fill="#374151">图书馆按「意思」排书架——「退货」和「退款」字</text>
<text x="644" y="290" font-size="18.5" fill="#374151">面不同，但被放在相邻的书架上，一查一个准。</text>
<rect x="50" y="478" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
