<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#F8F8FC"/>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="140" fill="url(#hd)"/>
<rect x="50" y="34" width="6" height="72" rx="3" fill="#FFFFFF" opacity="0.9"/>
<text x="78" y="76" font-size="40" font-weight="700" fill="#FFFFFF">微调</text>
<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">W1D2 · 术语类比卡 · 第 16 张</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="15" fill="#FFFFFF" text-anchor="middle">AI PM 八周训练营</text>
<rect x="50" y="168" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="168" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="195" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="208" font-size="21" font-weight="700" fill="#221E33">一句话定义</text>
<line x1="78" y1="226" x2="578" y2="226" stroke="#E5E7EB"/>
<text x="78" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">上岗前用标准问答教它按指令回答。</text>
<rect x="614" y="168" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="168" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">就是「岗前培训」。新同事再博学，也得有人拿一沓标准问答</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">一条条教：人家问「帮我写封请假邮件」，你就给一封格式正</text>
<text x="642" y="320.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">确的邮件，别给一篇聊邮件的散文。教到他明白「问问题是想</text>
<text x="642" y="350.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">要一个答案，不是想要我接着往下写」。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">最容易混的是「微调 vs 预训练」，刚刚说过：一个打底子、一</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">个改行为。第二个坑更致命：微调不加知识。你别指望微调能把</text>
<text x="78" y="622.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">公司上个月的新政策塞进它脑子，那是「给资料 / 检索」的活</text>
<text x="78" y="652.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">；微调改的是口吻、格式、按不按指令来这些「行为」。还有第</text>
<text x="78" y="682.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">三个坑：把这词当成「效果不好就微调一下」的万能药——面试追</text>
<text x="78" y="712.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">问那部分专门拆这个错。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「微调是用高质量的标注问答把续写引擎变成对话助手，它改</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">行为不加知识，也不是效果不好时的首选。」</text>
<line x1="50" y1="752" x2="1150" y2="752" stroke="#E5E7EB"/><text x="50" y="780" font-size="13" fill="#7A7590">03-配图素材/术语卡/04-微调.svg</text><text x="1150" y="780" font-size="13" fill="#7A7590" text-anchor="end">内容源自 02-讲课稿 · 共 420 张</text>
</svg>
