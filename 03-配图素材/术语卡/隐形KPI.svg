<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="800" fill="#F8F8FC"/>
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
<rect width="1200" height="140" fill="url(#hd)"/>
<rect x="50" y="34" width="6" height="72" rx="3" fill="#FFFFFF" opacity="0.9"/>
<text x="78" y="76" font-size="40" font-weight="700" fill="#FFFFFF">隐形KPI</text>
<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">W5D4 · 术语类比卡 · 第 251 张</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
<text x="1035" y="60" font-size="15" fill="#FFFFFF" text-anchor="middle">AI PM 八周训练营</text>
<rect x="50" y="168" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="168" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="195" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="208" font-size="21" font-weight="700" fill="#221E33">一句话定义</text>
<line x1="78" y1="226" x2="578" y2="226" stroke="#E5E7EB"/>
<text x="78" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">不写进考核表、却左右上级评价的隐性标准。先把缩写交代清楚</text>
<text x="78" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">：KPI 全称 Key Performance Indicator，中文「关键绩效</text>
<text x="78" y="320.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">指标」；「隐形」是说它没白纸黑字写进你的考核表。</text>
<rect x="614" y="168" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="168" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="195" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="208" font-size="21" font-weight="700" fill="#221E33">生活类比</text>
<line x1="642" y1="226" x2="1128" y2="226" stroke="#E5E7EB"/>
<text x="642" y="260.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">合租室友没把「倒垃圾」写进公约，但谁总让厨房堆着垃圾，</text>
<text x="642" y="290.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">大家心里都给他记了一笔。</text>
<rect x="50" y="470" width="550" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="50" y="470" width="5" height="286" rx="2.5" fill="#7C3AED"/>
<rect x="78" y="497" width="14" height="14" rx="4" fill="#7C3AED"/>
<text x="102" y="510" font-size="21" font-weight="700" fill="#221E33">易混辨析</text>
<line x1="78" y1="528" x2="578" y2="528" stroke="#E5E7EB"/>
<text x="78" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">容易混「正式绩效指标」——正式指标可量化、写明，隐形的是「</text>
<text x="78" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">靠不靠谱」这类印象；汇报质量就是典型一种。</text>
<rect x="614" y="470" width="536" height="286" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
<rect x="614" y="470" width="5" height="286" rx="2.5" fill="#2563EB"/>
<rect x="642" y="497" width="14" height="14" rx="4" fill="#2563EB"/>
<text x="666" y="510" font-size="21" font-weight="700" fill="#221E33">面试说法</text>
<line x1="642" y1="528" x2="1128" y2="528" stroke="#E5E7EB"/>
<text x="642" y="562.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">「我把汇报当隐形关键绩效指标来经营，因为上级对项目的判</text>
<text x="642" y="592.0" text-anchor="start" font-size="17.5" font-weight="400" fill="#4A4560">断大多来自我的汇报，我要给的是确定性。」</text>
<line x1="50" y1="752" x2="1150" y2="752" stroke="#E5E7EB"/><text x="50" y="780" font-size="13" fill="#7A7590">03-配图素材/术语卡/隐形KPI.svg</text><text x="1150" y="780" font-size="13" fill="#7A7590" text-anchor="end">内容源自 02-讲课稿 · 共 420 张</text>
</svg>
