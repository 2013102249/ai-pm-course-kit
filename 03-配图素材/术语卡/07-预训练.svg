<text x="102" y="208" font-size="21" font-weight="700" fill="#111827">一句话定义</text>
<line x1="78" y1="226" x2="572" y2="226" stroke="#E5E7EB"/>
<text x="80" y="260" font-size="18.5" fill="#374151">用海量公开文本让模型反复「预测下一个词」，练出语</text>
<text x="80" y="290" font-size="18.5" fill="#374151">言能力和世界知识，产出毛坯房式的基座。</text>
