<text x="644" y="260" font-size="18.5" fill="#374151">语义图书馆的馆藏系统——资料先按意思归档上架（</text>
<text x="644" y="290" font-size="18.5" fill="#374151">建库），读者按意思来查（检索），两条链路别混。</text>
