<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="760" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker></defs>
<rect x="40" y="30" width="4" height="24" fill="#7C3AED"/>
<text x="54" y="49" font-size="21" font-weight="700" fill="#221E33">面试追问链 · 两道高频题的三层追问</text>
<text x="54" y="72" font-size="12.5" fill="#7A7590">第 5 节（200–250 min）示范 2–3 层追问，累计 12 min｜左：题 2「幻觉怎么治理」　右：题 6「采纳率跌 20%」</text>
<rect x="40" y="108" width="540" height="96" rx="12" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="58" y="122" width="88" height="22" rx="11" fill="#7C3AED"/>
<text x="102" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">技术理解题</text>
<text x="58" y="168" text-anchor="start" font-size="13" font-weight="700" fill="#221E33">题 2 · 你们产品的幻觉是怎么治理的？</text>
<rect x="40" y="218" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="40" y="218" width="4" height="104" fill="#7C3AED"/>
<text x="60" y="242" text-anchor="start" font-size="10" font-weight="700" fill="#5B21B6">第 1 层</text>
<text x="60" y="266" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">你说的「治理」具体指哪一类幻觉？</text>
<text x="60" y="292" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：先分型——事实型（编事实）/ 指令型（不按格式），分型才谈方案</text>
<rect x="40" y="340" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="40" y="340" width="4" height="104" fill="#7C3AED"/>
<text x="60" y="364" text-anchor="start" font-size="10" font-weight="700" fill="#5B21B6">第 2 层</text>
<text x="60" y="388" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">RAG 能解决哪一类？解决不了哪一类？</text>
<text x="60" y="414" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：解决事实型；指令型靠约束、模板与评测，不能混为一谈</text>
<line x1="310" y1="322" x2="310" y2="336" stroke="#A5A1B8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="462" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="40" y="462" width="4" height="104" fill="#7C3AED"/>
<text x="60" y="486" text-anchor="start" font-size="10" font-weight="700" fill="#5B21B6">第 3 层</text>
<text x="60" y="510" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">你怎么证明治理有效？</text>
<text x="60" y="536" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：评测集 + 采纳率 + 人工抽检，三段证据缺一不可</text>
<line x1="310" y1="444" x2="310" y2="458" stroke="#A5A1B8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="612" y="108" width="540" height="96" rx="12" fill="#E8EFFD" stroke="#BFD4F5" stroke-width="1.5"/>
<rect x="630" y="122" width="88" height="22" rx="11" fill="#BFD4F5"/>
<text x="674" y="137" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">指标拆解题</text>
<text x="630" y="168" text-anchor="start" font-size="13" font-weight="700" fill="#221E33">题 6 · 上线两周采纳率跌了 20%，你怎么查？</text>
<rect x="612" y="218" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="612" y="218" width="4" height="104" fill="#BFD4F5"/>
<text x="632" y="242" text-anchor="start" font-size="10" font-weight="700" fill="#1D4ED8">第 1 层</text>
<text x="632" y="266" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">采纳率的口径是什么？谁定的？</text>
<text x="632" y="292" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：先确认分子分母与统计窗口——口径变了，20% 可能是假的</text>
<rect x="612" y="340" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="612" y="340" width="4" height="104" fill="#BFD4F5"/>
<text x="632" y="364" text-anchor="start" font-size="10" font-weight="700" fill="#1D4ED8">第 2 层</text>
<text x="632" y="388" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">分渠道 / 分场景拆了吗？</text>
<text x="632" y="414" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：先拆维度再归因，别拿一个总数直接讲原因</text>
<line x1="882" y1="322" x2="882" y2="336" stroke="#A5A1B8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="612" y="462" width="540" height="104" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="612" y="462" width="4" height="104" fill="#BFD4F5"/>
<text x="632" y="486" text-anchor="start" font-size="10" font-weight="700" fill="#1D4ED8">第 3 层</text>
<text x="632" y="510" text-anchor="start" font-size="12.5" font-weight="700" fill="#221E33">查出来是模型升级导致的，你怎么决策？</text>
<text x="632" y="536" text-anchor="start" font-size="10.8" font-weight="400" fill="#4A4560">应答：回滚 / 灰度 / 加护栏三选一，给出成本与风险评估</text>
<line x1="882" y1="444" x2="882" y2="458" stroke="#A5A1B8" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="592" width="1120" height="88" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="64" y="622" text-anchor="start" font-size="13.5" font-weight="700" fill="#5B21B6">通用套路（三句走完任何追问）</text>
<text x="64" y="650" text-anchor="start" font-size="11.5" font-weight="400" fill="#4A4560">① 先定义：把对方的词换成可观测的口径　② 再拆维度：渠道 / 场景 / 人群 / 时间　③ 最后给决策：回滚、灰度还是加护栏，附成本与风险</text>
<text x="40" y="712" text-anchor="start" font-size="11.5" font-weight="400" fill="#7A7590">用法：第 5 节逐题示范 → 学员按同结构写出剩余 6 题的追问链 → 第 6 节抽 2 题现场问答，录音留档。</text>
</svg>
