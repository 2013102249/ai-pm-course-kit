<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker>
  </defs>

  <!-- 标题区 -->
  <rect x="40" y="28" width="4" height="22" fill="#7C3AED"/>
  <text x="54" y="46" font-size="20" font-weight="700" fill="#221E33">工作流编排示意图</text>
  <text x="54" y="66" font-size="12" fill="#6B7280">主链路 · 失败分支三级兜底 · 人机接管点｜W3D2《Agent 产品设计与工作流实操》</text>

  <!-- 主链路五节点 -->
  <rect x="40" y="130" width="170" height="64" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="125" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">开始节点</text>
  <text x="125" y="178" text-anchor="middle" font-size="12" fill="#7A7590">用户输入</text>

  <rect x="265" y="130" width="170" height="64" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="350" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">LLM 节点</text>
  <text x="350" y="178" text-anchor="middle" font-size="12" fill="#7A7590">理解与生成</text>

  <rect x="490" y="130" width="170" height="64" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="575" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">工具节点</text>
  <text x="575" y="178" text-anchor="middle" font-size="12" fill="#7A7590">调用外部能力</text>

  <rect x="715" y="130" width="170" height="64" rx="10" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.5"/>
  <text x="800" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">条件分支</text>
  <text x="800" y="178" text-anchor="middle" font-size="12" fill="#7A7590">按条件走向</text>

  <rect x="940" y="130" width="170" height="64" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1025" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">输出节点</text>
  <text x="1025" y="178" text-anchor="middle" font-size="12" fill="#7A7590">返回结果</text>

  <!-- 主链路箭头 -->
  <line x1="212" y1="162" x2="261" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="437" y1="162" x2="486" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="662" y1="162" x2="711" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrP)"/>
  <line x1="887" y1="162" x2="936" y2="162" stroke="#7C3AED" stroke-width="1.6" marker-end="url(#arrP)"/>

  <!-- 变量传递标注（LLM → 工具 连线上） -->
  <text x="462" y="112" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED">输出变量 → 输入参数</text>
  <line x1="462" y1="118" x2="462" y2="158" stroke="#C9C2DE" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- 上路（成立）：条件分支 → 输出节点 -->
  <polyline points="800,130 800,98 1025,98 1025,126" fill="none" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="912" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">成立（正常返回）</text>

  <!-- 下路（不成立）：失败分支虚线 -->
  <polyline points="800,194 800,272 220,272 220,326" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="510" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#2563EB">不成立（执行失败 / 异常）</text>

  <!-- 失败分支三级兜底 -->
  <rect x="115" y="330" width="210" height="58" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="220" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">① 重试</text>
  <text x="220" y="375" text-anchor="middle" font-size="12" fill="#7A7590">瞬时失败</text>

  <rect x="375" y="330" width="210" height="58" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="480" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">② 降级</text>
  <text x="480" y="375" text-anchor="middle" font-size="12" fill="#7A7590">持续失败</text>

  <rect x="635" y="330" width="210" height="58" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="740" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">③ 转人工</text>
  <text x="740" y="375" text-anchor="middle" font-size="12" fill="#7A7590">最终出口</text>

  <rect x="895" y="330" width="225" height="58" rx="10" fill="#FFF7E8" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="921" cy="347" r="4.5" fill="#F59E0B"/>
  <path d="M 912,366 C 912,357 930,357 930,366 Z" fill="#F59E0B"/>
  <text x="944" y="356" font-size="15" font-weight="700" fill="#221E33">人工接管点</text>
  <text x="944" y="376" font-size="12" fill="#B45309">兜底型接管（事后）</text>

  <line x1="327" y1="359" x2="371" y2="359" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="587" y1="359" x2="631" y2="359" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="847" y1="359" x2="891" y2="359" stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- 审批型接管（事前）：高风险操作执行前 -->
  <text x="300" y="496" font-size="12" fill="#6B7280">高风险操作执行前，先人工审批再放行：</text>
  <circle cx="560" cy="484" r="5" fill="#F59E0B"/>
  <path d="M 550,504 C 550,494 570,494 570,504 Z" fill="#F59E0B"/>
  <text x="560" y="524" text-anchor="middle" font-size="12" font-weight="600" fill="#B45309">审批型接管（事前）</text>
  <line x1="586" y1="494" x2="624" y2="494" stroke="#A5A1B8" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="630" y="470" width="180" height="50" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="720" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#221E33">高风险操作执行</text>

  <!-- 图例 -->
  <line x1="40" y1="636" x2="80" y2="636" stroke="#7C3AED" stroke-width="2.4"/>
  <text x="88" y="640" font-size="12" fill="#6B7280">主链路（实线）</text>
  <line x1="220" y1="636" x2="260" y2="636" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="268" y="640" font-size="12" fill="#6B7280">失败分支（虚线）</text>
  <rect x="430" y="628" width="18" height="14" rx="3" fill="#FFF7E8" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="456" y="640" font-size="12" fill="#6B7280">人机接管点</text>
</svg>
