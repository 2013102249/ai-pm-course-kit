<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="830" fill="#FFFFFF"/>
  <defs>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
  </defs>

  <!-- 标题 -->
  <rect x="48" y="34" width="4" height="22" fill="#7C3AED"/>
  <text x="62" y="52" font-size="20" font-weight="700" fill="#221E33">PRD 评审流程图</text>
  <text x="62" y="76" font-size="12" fill="#6B7280">四段流程 × 四条角色泳道 · 争议时回切指认当前环节 · 产出不是分数，是带截止时间的修订要求清单</text>

  <!-- 段表头 -->
  <rect x="188" y="104" width="224" height="52" rx="8" fill="#7C3AED"/>
  <text x="300" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">陈述段</text>
  <text x="300" y="146" text-anchor="middle" font-size="11.5" fill="#E9E4F8">5 min / 人</text>
  <rect x="433" y="104" width="224" height="52" rx="8" fill="#7C3AED"/>
  <text x="545" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">质询段</text>
  <text x="545" y="146" text-anchor="middle" font-size="11.5" fill="#E9E4F8">5 min / 人</text>
  <rect x="678" y="104" width="224" height="52" rx="8" fill="#7C3AED"/>
  <text x="790" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">修订段</text>
  <text x="790" y="146" text-anchor="middle" font-size="11.5" fill="#E9E4F8">课后</text>
  <rect x="923" y="104" width="224" height="52" rx="8" fill="#7C3AED"/>
  <text x="1035" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">终审段</text>
  <text x="1035" y="146" text-anchor="middle" font-size="11.5" fill="#E9E4F8">65–85 min</text>

  <!-- 段间主流程箭头 -->
  <line x1="413" y1="130" x2="431" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="658" y1="130" x2="676" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <line x1="903" y1="130" x2="921" y2="130" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- 泳道 1 · 陈述人 -->
  <rect x="40" y="164" width="140" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="110" y="218" text-anchor="middle" font-size="13.5" font-weight="700" fill="#221E33">陈述人</text>
  <text x="110" y="240" text-anchor="middle" font-size="11" fill="#6B7280">（被评人）</text>
  <rect x="188" y="164" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="300" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">三段式陈述</text>
  <text x="300" y="228" text-anchor="middle" font-size="12" fill="#221E33">背景 1 min + 方案 2 min</text>
  <text x="300" y="250" text-anchor="middle" font-size="12" fill="#221E33">+ 数据与风险 2 min</text>
  <rect x="433" y="164" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="545" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">应答公式</text>
  <text x="545" y="228" text-anchor="middle" font-size="12" fill="#221E33">复述问题 → 给答案 → 给依据</text>
  <rect x="678" y="164" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="790" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">按修订要求改 PRD</text>
  <text x="790" y="228" text-anchor="middle" font-size="12" fill="#221E33">V1.0 → V2.0</text>
  <rect x="923" y="164" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="1035" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">回答「最没把握的一章」</text>
  <text x="1035" y="228" text-anchor="middle" font-size="12" fill="#221E33">接受裁定</text>

  <!-- 泳道 2 · 质询人 -->
  <rect x="40" y="292" width="140" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="110" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#221E33">质询人</text>
  <rect x="188" y="292" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="300" y="356" text-anchor="middle" font-size="12" fill="#221E33">听陈述、记问题</text>
  <rect x="433" y="292" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="545" y="326" text-anchor="middle" font-size="11.5" font-weight="700" fill="#221E33">三类问题各至少 1 问</text>
  <text x="545" y="347" text-anchor="middle" font-size="11.5" fill="#221E33">（目标类 / 方案类 / 数据类）</text>
  <text x="545" y="368" text-anchor="middle" font-size="11.5" fill="#221E33">收尾 1 min 研发评估：</text>
  <text x="545" y="389" text-anchor="middle" font-size="11.5" fill="#221E33">人日 / 排期 / 风险</text>
  <rect x="678" y="292" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="790" y="356" text-anchor="middle" font-size="12" fill="#9CA3AF">—</text>
  <rect x="923" y="292" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="1035" y="356" text-anchor="middle" font-size="12" fill="#9CA3AF">—</text>

  <!-- 泳道 3 · 记录人 -->
  <rect x="40" y="420" width="140" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="110" y="484" text-anchor="middle" font-size="13.5" font-weight="700" fill="#221E33">记录人</text>
  <rect x="188" y="420" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="300" y="484" text-anchor="middle" font-size="12" fill="#221E33">控时提醒</text>
  <rect x="433" y="420" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="545" y="454" text-anchor="middle" font-size="11.5" fill="#221E33">四维打分 + 质询记录</text>
  <text x="545" y="475" text-anchor="middle" font-size="11.5" fill="#221E33">+ 修订要求</text>
  <text x="545" y="496" text-anchor="middle" font-size="11.5" fill="#221E33">（当场念给被评人确认）</text>
  <rect x="678" y="420" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="790" y="484" text-anchor="middle" font-size="12" fill="#221E33">汇总修订要求上墙</text>
  <rect x="923" y="420" width="224" height="118" rx="8" fill="#F1EBFD" stroke="#E8E5F1" stroke-width="1"/>
  <text x="1035" y="484" text-anchor="middle" font-size="12" fill="#221E33">誊写终审口径与裁定档位</text>

  <!-- 泳道 4 · 讲师 -->
  <rect x="40" y="548" width="140" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="110" y="612" text-anchor="middle" font-size="13.5" font-weight="700" fill="#221E33">讲师</text>
  <rect x="188" y="548" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="300" y="612" text-anchor="middle" font-size="12" fill="#221E33">规则宣讲</text>
  <rect x="433" y="548" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="545" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">巡场纠偏</text>
  <text x="545" y="623" text-anchor="middle" font-size="12" fill="#221E33">（挑刺 / 只夸两类苗头）</text>
  <rect x="678" y="548" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="790" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">逐条核对三要素</text>
  <text x="790" y="623" text-anchor="middle" font-size="12" fill="#221E33">（改哪章 / 改成什么 / 截止时间）</text>
  <rect x="923" y="548" width="224" height="118" rx="8" fill="#FFFFFF" stroke="#E8E5F1" stroke-width="1"/>
  <text x="1035" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#221E33">逐组裁定：</text>
  <text x="1035" y="623" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">过审 / 有条件通过 / 退回</text>

  <!-- 段产出标签 -->
  <rect x="433" y="678" width="224" height="30" rx="15" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.2"/>
  <text x="545" y="697" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">产出：质询记录表</text>
  <rect x="678" y="678" width="224" height="30" rx="15" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.2"/>
  <text x="790" y="697" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">产出：修订要求清单</text>
  <rect x="923" y="678" width="224" height="30" rx="15" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.2"/>
  <text x="1035" y="697" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">产出：裁定档位</text>

  <!-- 硬约束（虚线框） -->
  <text x="40" y="742" font-size="12" font-weight="700" fill="#2563EB">硬约束</text>
  <rect x="40" y="754" width="262" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="171" y="782" text-anchor="middle" font-size="12.5" fill="#221E33">禁照读 PRD，超时硬切</text>
  <rect x="315" y="754" width="262" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="446" y="782" text-anchor="middle" font-size="12.5" fill="#221E33">只提问，不下结论</text>
  <rect x="590" y="754" width="262" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="721" y="782" text-anchor="middle" font-size="12.5" fill="#221E33">修订要求无日期无效</text>
  <rect x="865" y="754" width="262" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="996" y="782" text-anchor="middle" font-size="12.5" fill="#221E33">全员满分 = 评审失败</text>
</svg>
