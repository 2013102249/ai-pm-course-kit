<rect x="50" y="422" width="6" height="118" rx="3" fill="#7C3AED"/>
<text x="76" y="458" font-size="15" font-weight="700" fill="#5B21B6">第 2 层追问</text>
<text x="76" y="492" font-size="20" font-weight="700" fill="#221E33">谁签字才算放行？</text>
<text x="76" y="520" font-size="15" fill="#4A4560">应答要点：先结论 → 踩分点 → 承认边界 → 落到岗位价值；追到第三层不散才算过关。</text>
<path d="M600,540 L600,562" stroke="#7A7590" stroke-width="2"/>
