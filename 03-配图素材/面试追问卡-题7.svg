<rect x="50" y="562" width="6" height="118" rx="3" fill="#2563EB"/>
<text x="76" y="598" font-size="15" font-weight="700" fill="#2563EB">第 3 层追问</text>
<text x="76" y="632" font-size="20" font-weight="700" fill="#221E33">上线后发现遗漏怎么回滚？</text>
<text x="76" y="660" font-size="15" fill="#4A4560">应答要点：先结论 → 踩分点 → 承认边界 → 落到岗位价值；追到第三层不散才算过关。</text>
