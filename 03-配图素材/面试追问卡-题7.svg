<text x="74" y="228" font-size="22" font-weight="700" fill="#221E33">上线前的合规检查清单怎么过</text>
<rect x="50" y="282" width="1100" height="118" rx="12" fill="#FFFFFF" stroke="#C9C2DE"/>
<rect x="50" y="282" width="6" height="118" rx="3" fill="#7C3AED"/>
<text x="76" y="318" font-size="15" font-weight="700" fill="#5B21B6">第 1 层追问</text>
<text x="76" y="352" font-size="20" font-weight="700" fill="#221E33">清单分哪几组，各查几项？</text>
<text x="76" y="380" font-size="15" fill="#4A4560">应答要点：先结论 → 踩分点 → 承认边界 → 落到岗位价值；追到第三层不散才算过关。</text>
<path d="M600,400 L600,422" stroke="#7A7590" stroke-width="2"/>
