<text x="80" y="112" font-size="18" fill="#FFFFFF" opacity="0.88">通用共享卡 · 适配各日两两模拟（2–3 层追问）</text>
<rect x="920" y="34" width="230" height="40" rx="20" fill="#FFFFFF" opacity="0.16"/>
