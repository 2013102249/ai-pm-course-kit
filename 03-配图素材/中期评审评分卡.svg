<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="750" fill="#FFFFFF"/>
  <rect x="40" y="42" width="4" height="22" fill="#7C3AED"/>
  <text x="54" y="60" font-size="20" font-weight="700" fill="#221E33">主项目中期评审 · 评分卡</text>
  <text x="54" y="82" font-size="12" fill="#6B7280">W5 里程碑 ④ ｜ 姓名 ______________　项目 ______________　日期 ______________</text>

  <!-- 表头 -->
  <rect x="40" y="104" width="160" height="40" fill="#7C3AED"/>
  <text x="120" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">评分维度</text>
  <rect x="200" y="104" width="960" height="40" fill="#2563EB"/>
  <text x="345" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">0–2 分（弱）</text>
  <text x="635" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3–4 分（中）</text>
  <text x="925" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5 分（优）</text>
  <text x="1115" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">分数</text>

  <!-- 行 1 -->
  <rect x="40" y="144" width="160" height="62" fill="#7C3AED"/>
  <text x="120" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">问题真实度</text>
  <text x="345" y="180" text-anchor="middle" font-size="13" fill="#221E33">人群无边界，痛点靠想象</text>
  <text x="635" y="180" text-anchor="middle" font-size="13" fill="#221E33">人群有边界，痛点有访谈支撑</text>
  <text x="925" y="180" text-anchor="middle" font-size="13" fill="#221E33">访谈 + 问卷双源数据，替换成本讲得清</text>
  <rect x="1082" y="156" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <!-- 行 2 -->
  <rect x="40" y="206" width="160" height="62" fill="#7C3AED"/>
  <text x="120" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">方案完整度</text>
  <text x="345" y="242" text-anchor="middle" font-size="13" fill="#221E33">只有功能罗列</text>
  <text x="635" y="242" text-anchor="middle" font-size="13" fill="#221E33">功能与痛点对应，流程完整</text>
  <text x="925" y="242" text-anchor="middle" font-size="13" fill="#221E33">含兜底设计，功能与指标挂钩</text>
  <rect x="1082" y="218" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <!-- 行 3 -->
  <rect x="40" y="268" width="160" height="62" fill="#7C3AED"/>
  <text x="120" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">数据支撑</text>
  <text x="345" y="304" text-anchor="middle" font-size="13" fill="#221E33">全程无数字</text>
  <text x="635" y="304" text-anchor="middle" font-size="13" fill="#221E33">有关键数字但部分无出处</text>
  <text x="925" y="304" text-anchor="middle" font-size="13" fill="#221E33">每个论断有数据且注明样本与来源</text>
  <rect x="1082" y="280" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <!-- 行 4 -->
  <rect x="40" y="330" width="160" height="62" fill="#7C3AED"/>
  <text x="120" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">成本可信度</text>
  <text x="345" y="366" text-anchor="middle" font-size="13" fill="#221E33">说不清单次成本</text>
  <text x="635" y="366" text-anchor="middle" font-size="13" fill="#221E33">有成本数但无法复算</text>
  <text x="925" y="366" text-anchor="middle" font-size="13" fill="#221E33">单次与月度成本当场可复算，毛利结论明确</text>
  <rect x="1082" y="342" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
  <!-- 行 5 -->
  <rect x="40" y="392" width="160" height="62" fill="#7C3AED"/>
  <text x="120" y="428" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">风险预判</text>
  <text x="345" y="428" text-anchor="middle" font-size="13" fill="#221E33">未提风险</text>
  <text x="635" y="428" text-anchor="middle" font-size="13" fill="#221E33">提了风险无应对</text>
  <text x="925" y="428" text-anchor="middle" font-size="13" fill="#221E33">风险有优先级、有应对动作</text>
  <rect x="1082" y="404" width="66" height="38" rx="6" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>

  <!-- 表格线 -->
  <line x1="200" y1="144" x2="200" y2="454" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="490" y1="144" x2="490" y2="454" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="780" y1="144" x2="780" y2="454" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="1070" y1="144" x2="1070" y2="454" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="40" y1="206" x2="1160" y2="206" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="40" y1="268" x2="1160" y2="268" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="40" y1="330" x2="1160" y2="330" stroke="#E8E5F1" stroke-width="1.2"/>
  <line x1="40" y1="392" x2="1160" y2="392" stroke="#E8E5F1" stroke-width="1.2"/>
  <rect x="40" y="104" width="1120" height="350" fill="none" stroke="#C9C2DE" stroke-width="1.4"/>

  <!-- 及格线提示条 -->
  <rect x="40" y="478" width="1120" height="50" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="600" y="509" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">及格线：每维 ≥3 分 且 总分 ≥18/25；任一维 &lt;3 即视为未过，进入下周一带材料重审</text>

  <!-- 质询记录区 -->
  <text x="40" y="566" font-size="14" font-weight="700" fill="#221E33">质询记录（对应投资人五问，每轮 ≥1 条）</text>
  <line x1="40" y1="600" x2="1160" y2="600" stroke="#C9C2DE" stroke-width="1.2"/>
  <line x1="40" y1="636" x2="1160" y2="636" stroke="#C9C2DE" stroke-width="1.2"/>
  <line x1="40" y1="672" x2="1160" y2="672" stroke="#C9C2DE" stroke-width="1.2"/>
  <text x="1160" y="710" text-anchor="end" font-size="13" fill="#221E33">质询人签名 ______________________</text>
</svg>
