<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="890" fill="#FFFFFF"/>

  <!-- 标题区 + 编号/签名栏 -->
  <rect x="40" y="26" width="4" height="22" fill="#7C3AED"/>
  <text x="54" y="44" font-size="22" font-weight="700" fill="#221E33">评审三维评分卡</text>
  <text x="54" y="64" font-size="12" fill="#6B7280">三维度 × 0–5 分 × 打分依据必填｜W3D5《原型评审 I》</text>
  <text x="820" y="44" font-size="14" fill="#221E33">被评组：第 ______ 组</text>
  <text x="1010" y="44" font-size="14" fill="#221E33">评审人：__________</text>

  <!-- 列标签 -->
  <text x="320" y="92" font-size="11" fill="#6B7280">0–5 分，在对应分数上打勾</text>
  <text x="600" y="92" font-size="11" fill="#6B7280">打分依据（必写一句话）</text>

  <!-- 行底色条带（第 1、3 行浅紫） -->
  <rect x="40" y="100" width="1120" height="120" fill="#F1EBFD"/>
  <rect x="40" y="340" width="1120" height="120" fill="#F1EBFD"/>
  <line x1="300" y1="100" x2="300" y2="460" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="580" y1="100" x2="580" y2="460" stroke="#E8E5F1" stroke-width="1"/>

  <!-- 行 1 · 用户价值 -->
  <text x="64" y="150" font-size="18" font-weight="700" fill="#5B21B6">用户价值</text>
  <text x="64" y="178" font-size="12" fill="#2563EB">谁在用 / 解决什么</text>
  <text x="64" y="198" font-size="12" fill="#2563EB">现在怎么解决</text>
  <rect x="320" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="360" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="400" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="440" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="480" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="520" y="142" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="332" y="184" text-anchor="middle" font-size="12" fill="#6B7280">0</text>
  <text x="372" y="184" text-anchor="middle" font-size="12" fill="#6B7280">1</text>
  <text x="412" y="184" text-anchor="middle" font-size="12" fill="#6B7280">2</text>
  <text x="452" y="184" text-anchor="middle" font-size="12" fill="#6B7280">3</text>
  <text x="492" y="184" text-anchor="middle" font-size="12" fill="#6B7280">4</text>
  <text x="532" y="184" text-anchor="middle" font-size="12" fill="#6B7280">5</text>
  <line x1="600" y1="158" x2="1140" y2="158" stroke="#A5A1B8" stroke-width="1.2"/>

  <!-- 行 2 · 技术可行 -->
  <text x="64" y="270" font-size="18" font-weight="700" fill="#5B21B6">技术可行</text>
  <text x="64" y="298" font-size="12" fill="#2563EB">数据从哪来 / 调什么能力</text>
  <text x="64" y="318" font-size="12" fill="#2563EB">多久能做</text>
  <rect x="320" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="360" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="400" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="440" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="480" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="520" y="262" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="332" y="304" text-anchor="middle" font-size="12" fill="#6B7280">0</text>
  <text x="372" y="304" text-anchor="middle" font-size="12" fill="#6B7280">1</text>
  <text x="412" y="304" text-anchor="middle" font-size="12" fill="#6B7280">2</text>
  <text x="452" y="304" text-anchor="middle" font-size="12" fill="#6B7280">3</text>
  <text x="492" y="304" text-anchor="middle" font-size="12" fill="#6B7280">4</text>
  <text x="532" y="304" text-anchor="middle" font-size="12" fill="#6B7280">5</text>
  <line x1="600" y1="278" x2="1140" y2="278" stroke="#A5A1B8" stroke-width="1.2"/>

  <!-- 行 3 · 体验 -->
  <text x="64" y="390" font-size="18" font-weight="700" fill="#5B21B6">体验</text>
  <text x="64" y="418" font-size="12" fill="#2563EB">第一次用会不会懵</text>
  <text x="64" y="438" font-size="12" fill="#2563EB">错了怎么办</text>
  <rect x="320" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="360" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="400" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="440" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="480" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <rect x="520" y="382" width="24" height="24" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="332" y="424" text-anchor="middle" font-size="12" fill="#6B7280">0</text>
  <text x="372" y="424" text-anchor="middle" font-size="12" fill="#6B7280">1</text>
  <text x="412" y="424" text-anchor="middle" font-size="12" fill="#6B7280">2</text>
  <text x="452" y="424" text-anchor="middle" font-size="12" fill="#6B7280">3</text>
  <text x="492" y="424" text-anchor="middle" font-size="12" fill="#6B7280">4</text>
  <text x="532" y="424" text-anchor="middle" font-size="12" fill="#6B7280">5</text>
  <line x1="600" y1="398" x2="1140" y2="398" stroke="#A5A1B8" stroke-width="1.2"/>

  <!-- 底部填写区 1 · 我的追问 -->
  <text x="64" y="506" font-size="15" font-weight="700" fill="#2563EB">我的追问</text>
  <line x1="190" y1="502" x2="1140" y2="502" stroke="#A5A1B8" stroke-width="1.2"/>
  <line x1="190" y1="532" x2="1140" y2="532" stroke="#A5A1B8" stroke-width="1.2"/>

  <!-- 底部填写区 2 · 一句话建议 -->
  <text x="64" y="576" font-size="15" font-weight="700" fill="#2563EB">一句话建议</text>
  <line x1="190" y1="572" x2="1140" y2="572" stroke="#A5A1B8" stroke-width="1.2"/>
  <line x1="190" y1="602" x2="1140" y2="602" stroke="#A5A1B8" stroke-width="1.2"/>
  <text x="1140" y="624" text-anchor="end" font-size="11" fill="#6B7280">全员满分 = 评审失败</text>

  <!-- 三档描述表 -->
  <text x="64" y="662" font-size="14" font-weight="700" fill="#221E33">三档描述（打分前先对一眼 · 打印版印于卡背）</text>
  <rect x="40" y="676" width="1120" height="32" fill="#E8EFFD"/>
  <text x="110" y="697" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">维度</text>
  <text x="330" y="697" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">2 分及以下</text>
  <text x="640" y="697" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">3 分</text>
  <text x="980" y="697" text-anchor="middle" font-size="13" font-weight="700" fill="#2563EB">4–5 分</text>

  <!-- 档位表列边界：维度 40–180｜2 分及以下 180–480｜3 分 480–800｜4–5 分 800–1160
       描述文字统一按「列左边界 + 16」定位（196 / 496 / 816），维度名在首列居中 -->
  <!-- 维度列浅紫底，与上方三维度条带呼应 -->
  <rect x="41" y="709" width="138" height="160" fill="#FAF8FE"/>

  <!-- 行 1 · 用户价值档位 -->
  <text x="110" y="740" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">用户价值</text>
  <text x="196" y="729" font-size="11.5" fill="#221E33">答不清谁在用、解决什么，</text>
  <text x="196" y="747" font-size="11.5" fill="#221E33">或「所有人都是用户」</text>
  <text x="496" y="729" font-size="11.5" fill="#221E33">人群与问题明确，但答不出</text>
  <text x="496" y="747" font-size="11.5" fill="#221E33">「用户现在怎么解决」</text>
  <text x="816" y="729" font-size="11.5" fill="#221E33">人群具体、问题高频，且能对比</text>
  <text x="816" y="747" font-size="11.5" fill="#221E33">现有解法说出差异</text>

  <!-- 行 2 · 技术可行档位 -->
  <text x="110" y="794" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">技术可行</text>
  <text x="196" y="783" font-size="11.5" fill="#221E33">数据来源说不清，或架构图无</text>
  <text x="196" y="801" font-size="11.5" fill="#221E33">四要素标注（画成功能清单）</text>
  <text x="496" y="783" font-size="11.5" fill="#221E33">调用路径清楚（API / 工作流），</text>
  <text x="496" y="801" font-size="11.5" fill="#221E33">但估时缺失或不合理</text>
  <text x="816" y="783" font-size="11.5" fill="#221E33">数据来源、调用能力、估时三者</text>
  <text x="816" y="801" font-size="11.5" fill="#221E33">齐全且口径合理（按天估）</text>

  <!-- 行 3 · 体验档位 -->
  <text x="110" y="848" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">体验</text>
  <text x="196" y="837" font-size="11.5" fill="#221E33">无引导无兜底，演示依赖提前</text>
  <text x="196" y="855" font-size="11.5" fill="#221E33">写死的输入</text>
  <text x="496" y="837" font-size="11.5" fill="#221E33">有引导或兜底之一，但错误路</text>
  <text x="496" y="855" font-size="11.5" fill="#221E33">径未设计</text>
  <text x="816" y="837" font-size="11.5" fill="#221E33">首次使用有引导 / 示例 / 默认值，</text>
  <text x="816" y="855" font-size="11.5" fill="#221E33">错误有兜底且结果可溯源</text>

  <!-- 档位表网格 -->
  <line x1="180" y1="676" x2="180" y2="870" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="480" y1="676" x2="480" y2="870" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="800" y1="676" x2="800" y2="870" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="708" x2="1160" y2="708" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="762" x2="1160" y2="762" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="816" x2="1160" y2="816" stroke="#E8E5F1" stroke-width="1"/>
  <rect x="40" y="676" width="1120" height="194" fill="none" stroke="#C9C2DE" stroke-width="1.4"/>
</svg>
