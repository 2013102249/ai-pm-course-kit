<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="700" fill="#FFFFFF"/>
<defs>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
</defs>
<rect x="40" y="34" width="4" height="22" fill="#7C3AED"/>
<text x="54" y="52" font-size="20" font-weight="700" fill="#221E33">场景设计六步框架图</text>
<text x="54" y="74" font-size="12" fill="#6B7280">人群 → 场景 → 痛点 → 方案 → 指标 → 风险 · 每步含产出物与常见跑偏 · 示例：老年人 AI 用药提醒</text>
<!-- 六步主节点 -->
<rect x="24" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="46" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="46" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text>
<text x="130" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">人群</text>
<rect x="218" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="240" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="240" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text>
<text x="324" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">场景</text>
<rect x="412" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="434" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="434" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text>
<text x="518" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">痛点</text>
<rect x="606" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="628" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="628" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text>
<text x="712" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">方案</text>
<rect x="800" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="822" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="822" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text>
<text x="906" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">指标</text>
<rect x="994" y="120" width="182" height="56" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<circle cx="1016" cy="148" r="13" fill="#5B21B6" stroke="#FFFFFF" stroke-width="1"/>
<text x="1016" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">6</text>
<text x="1100" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">风险</text>
<!-- 主流程箭头 -->
<line x1="208" y1="148" x2="212" y2="148" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="402" y1="148" x2="406" y2="148" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="596" y1="148" x2="600" y2="148" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="790" y1="148" x2="794" y2="148" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<line x1="984" y1="148" x2="988" y2="148" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrb)"/>
<!-- 产出物小卡 -->
<rect x="24" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="115" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="115" y="246" text-anchor="middle" font-size="12" fill="#221E33">一类可命名、可触达的人</text>
<text x="115" y="266" text-anchor="middle" font-size="12" fill="#221E33">+ 关键特征</text>
<rect x="218" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="309" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="309" y="246" text-anchor="middle" font-size="12" fill="#221E33">时间、地点、频次</text>
<text x="309" y="266" text-anchor="middle" font-size="12" fill="#221E33">构成的真实情境</text>
<rect x="412" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="503" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="503" y="246" text-anchor="middle" font-size="12" fill="#221E33">真实问题 + 后果</text>
<text x="503" y="266" text-anchor="middle" font-size="12" fill="#221E33">（最好是观察到的）</text>
<rect x="606" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="697" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="697" y="246" text-anchor="middle" font-size="12" fill="#221E33">与痛点一一对应的</text>
<text x="697" y="266" text-anchor="middle" font-size="12" fill="#221E33">功能与形态</text>
<rect x="800" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="891" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="891" y="246" text-anchor="middle" font-size="12" fill="#221E33">可量化、可验证的</text>
<text x="891" y="266" text-anchor="middle" font-size="12" fill="#221E33">成功标准</text>
<rect x="994" y="200" width="182" height="96" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.3"/>
<text x="1085" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#2563EB">产出物</text>
<text x="1085" y="246" text-anchor="middle" font-size="12" fill="#221E33">技术风险 + 业务</text>
<text x="1085" y="266" text-anchor="middle" font-size="12" fill="#221E33">合规风险 + 应对</text>
<!-- 常见跑偏小卡 -->
<rect x="24" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="115" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="115" y="360" text-anchor="middle" font-size="12" fill="#DC2626">说「所有人」「有需要的人」</text>
<rect x="218" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="309" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="309" y="360" text-anchor="middle" font-size="12" fill="#DC2626">只讲情境不讲频次</text>
<rect x="412" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="503" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="503" y="360" text-anchor="middle" font-size="12" fill="#DC2626">痛点靠猜、与人群错位</text>
<rect x="606" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="697" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="697" y="360" text-anchor="middle" font-size="12" fill="#DC2626">功能堆砌、与痛点脱节</text>
<rect x="800" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="891" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="891" y="360" text-anchor="middle" font-size="12" fill="#DC2626">说「提升用户体验」</text>
<rect x="994" y="312" width="182" height="72" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
<text x="1085" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">常见跑偏</text>
<text x="1085" y="360" text-anchor="middle" font-size="12" fill="#DC2626">整步漏掉、只提技术</text>
<!-- 示例带 -->
<rect x="24" y="408" width="1152" height="222" rx="12" fill="#F1EBFD"/>
<text x="44" y="436" font-size="12" font-weight="700" fill="#5B21B6">示例 · 老年人 AI 用药提醒（逐节点对照）</text>
<line x1="212" y1="452" x2="212" y2="612" stroke="#DDD2F7" stroke-width="1"/>
<line x1="406" y1="452" x2="406" y2="612" stroke="#DDD2F7" stroke-width="1"/>
<line x1="600" y1="452" x2="600" y2="612" stroke="#DDD2F7" stroke-width="1"/>
<line x1="794" y1="452" x2="794" y2="612" stroke="#DDD2F7" stroke-width="1"/>
<line x1="988" y1="452" x2="988" y2="612" stroke="#DDD2F7" stroke-width="1"/>
<text x="115" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">65 岁以上、每日服药</text>
<text x="115" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">3 种以上的慢病老人</text>
<text x="115" y="530" text-anchor="middle" font-size="12" fill="#4C1D95">子女不同住</text>
<text x="309" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">每天早晚饭后</text>
<text x="309" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">30 分钟内服药</text>
<text x="309" y="530" text-anchor="middle" font-size="12" fill="#4C1D95">一天 2–3 次</text>
<text x="503" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">记不住、分不清</text>
<text x="503" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">饭前饭后，漏服</text>
<text x="503" y="530" text-anchor="middle" font-size="12" fill="#4C1D95">子女不知情</text>
<text x="697" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">语音大字提醒</text>
<text x="697" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">拍照识药建档</text>
<text x="697" y="530" text-anchor="middle" font-size="12" fill="#4C1D95">漏服通知子女端</text>
<text x="891" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">7 日漏服率下降</text>
<text x="891" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">家属端通知打开率</text>
<text x="1085" y="482" text-anchor="middle" font-size="12" fill="#4C1D95">误识药品需人工确认</text>
<text x="1085" y="506" text-anchor="middle" font-size="12" fill="#4C1D95">不替代医嘱</text>
<text x="1085" y="530" text-anchor="middle" font-size="12" fill="#4C1D95">加免责提示</text>
<text x="1176" y="668" text-anchor="end" font-size="10" fill="#6B7280">AI 产品经理就业训练营 · W8D2</text>
</svg>
