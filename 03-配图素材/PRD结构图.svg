<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="860" fill="#FFFFFF"/>

  <!-- 标题 -->
  <rect x="48" y="34" width="4" height="22" fill="#7C3AED"/>
  <text x="62" y="52" font-size="20" font-weight="700" fill="#221E33">AI 产品 PRD 十章骨架</text>
  <text x="62" y="76" font-size="12" fill="#6B7280">纵向四组分区 · 紫 / 蓝双色系 · 评测标准三要素见底部注脚</text>

  <!-- 分组一：为什么做 -->
  <rect x="56" y="136" width="190" height="110" rx="10" fill="#2563EB"/>
  <text x="151" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">为什么做</text>
  <text x="151" y="212" text-anchor="middle" font-size="12" fill="#DBE7FE">① ② ③</text>
  <rect x="280" y="136" width="268" height="110" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="414" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">① 背景</text>
  <rect x="578" y="136" width="268" height="110" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="712" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">② 目标</text>
  <rect x="876" y="136" width="268" height="110" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="1010" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">③ 用户与场景</text>

  <!-- 分组二：做什么 -->
  <rect x="56" y="316" width="190" height="110" rx="10" fill="#7C3AED"/>
  <text x="151" y="366" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">做什么</text>
  <text x="151" y="392" text-anchor="middle" font-size="12" fill="#E9E4F8">④ ⑤</text>
  <rect x="280" y="316" width="268" height="110" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="414" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">④ 功能需求</text>
  <rect x="578" y="316" width="268" height="110" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="712" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑤ AI 能力需求</text>
  <text x="836" y="336" text-anchor="end" font-size="11" font-weight="700" fill="#7C3AED">AI 产品特有</text>

  <!-- 分组三：怎么算好 -->
  <rect x="56" y="496" width="190" height="110" rx="10" fill="#7C3AED"/>
  <text x="151" y="546" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">怎么算好</text>
  <text x="151" y="572" text-anchor="middle" font-size="12" fill="#E9E4F8">⑥ ⑦ ⑧ ⑨</text>
  <rect x="280" y="496" width="195" height="110" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="465" y="541" text-anchor="end" font-size="10.5" font-weight="700" fill="#7C3AED">差异落点</text>
  <text x="377" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑥ 评测标准</text>
  <rect x="503" y="496" width="195" height="110" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="688" y="541" text-anchor="end" font-size="10.5" font-weight="700" fill="#7C3AED">差异落点</text>
  <text x="600" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑦ 容错兜底</text>
  <rect x="726" y="496" width="195" height="110" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="911" y="541" text-anchor="end" font-size="10.5" font-weight="700" fill="#7C3AED">差异落点</text>
  <text x="823" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑧ 成本预算</text>
  <rect x="949" y="496" width="195" height="110" rx="10" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="1134" y="541" text-anchor="end" font-size="10.5" font-weight="700" fill="#7C3AED">差异落点</text>
  <text x="1046" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑨ 数据回流</text>

  <!-- 分组四：怕什么 -->
  <rect x="56" y="676" width="190" height="110" rx="10" fill="#2563EB"/>
  <text x="151" y="726" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">怕什么</text>
  <text x="151" y="752" text-anchor="middle" font-size="12" fill="#DBE7FE">⑩</text>
  <rect x="280" y="676" width="268" height="110" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.4"/>
  <text x="414" y="738" text-anchor="middle" font-size="16" font-weight="700" fill="#221E33">⑩ 风险</text>

  <!-- 底部注脚 -->
  <rect x="280" y="812" width="560" height="36" rx="18" fill="#E8EFFD" stroke="#2563EB" stroke-width="1.2"/>
  <text x="560" y="835" text-anchor="middle" font-size="13" fill="#2563EB">评测标准三要素：指标名 + 数字门槛 + 数据来源</text>
</svg>
