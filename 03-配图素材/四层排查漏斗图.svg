<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arwG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A5A1B8"/></marker>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <rect x="30" y="36" width="4" height="22" fill="#7C3AED"/>
  <text x="42" y="54" font-size="20" font-weight="700" fill="#221E33">四层排查漏斗图</text>
  <text x="42" y="76" font-size="12" fill="#6B7280">badcase 归因顺序 · 越往下排查成本越高 · W6D4</text>

  <!-- 左侧成本色带 -->
  <rect x="40" y="120" width="12" height="560" fill="url(#bandGrad)"/>
  <text transform="rotate(-90 26 400)" x="26" y="400" text-anchor="middle" font-size="11" fill="#6B7280">排查成本逐层升高</text>

  <!-- 第 1 层 -->
  <rect x="70" y="120" width="720" height="110" rx="12" fill="#2563EB"/>
  <text x="430" y="183" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">第 1 层 · 引用原文对吗？</text>

  <path d="M430,230 L430,262" fill="none" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <line x1="790" y1="175" x2="846" y2="175" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <circle cx="866" cy="175" r="11" fill="#E8EFFD"/>
  <path d="M860,175 L864,180 L873,169" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="886" y="180" font-size="13" fill="#6B7280">排除，往下一层</text>

  <!-- 第 2 层 -->
  <rect x="140" y="270" width="580" height="110" rx="12" fill="#4C44C4"/>
  <text x="430" y="333" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">第 2 层 · chunk 完整吗？</text>

  <path d="M430,380 L430,412" fill="none" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <line x1="720" y1="325" x2="776" y2="325" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <circle cx="796" cy="325" r="11" fill="#E8EFFD"/>
  <path d="M790,325 L794,330 L803,319" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="816" y="330" font-size="13" fill="#6B7280">排除，往下一层</text>

  <!-- 第 3 层 -->
  <rect x="210" y="420" width="440" height="110" rx="12" fill="#6D3BB8"/>
  <text x="430" y="483" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">第 3 层 · 正确资料召回了吗？</text>

  <path d="M430,530 L430,562" fill="none" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <line x1="650" y1="475" x2="706" y2="475" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <circle cx="726" cy="475" r="11" fill="#E8EFFD"/>
  <path d="M720,475 L724,480 L733,469" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="746" y="480" font-size="13" fill="#6B7280">排除，往下一层</text>

  <!-- 第 4 层 -->
  <rect x="280" y="570" width="300" height="110" rx="12" fill="#7C3AED"/>
  <text x="430" y="617" text-anchor="middle" font-size="13" fill="#EDE7FB">第 4 层</text>
  <text x="430" y="645" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">裸模型拿着好资料还错吗？</text>

  <line x1="580" y1="625" x2="636" y2="625" stroke="#A5A1B8" stroke-width="2" marker-end="url(#arwG)"/>
  <rect x="656" y="605" width="158" height="40" rx="10" fill="#7C3AED"/>
  <text x="735" y="630" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">定位：生成问题</text>

  <!-- 底部口诀条 -->
  <rect x="70" y="716" width="1060" height="52" rx="10" fill="#F1EBFD"/>
  <text x="600" y="749" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">排查口诀：先数据后模型 · 先便宜后贵</text>
</svg>
