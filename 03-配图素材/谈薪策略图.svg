<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
<rect width="1200" height="700" fill="#FFFFFF"/>
<defs>
<marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker>
</defs>
<rect x="40" y="34" width="4" height="22" fill="#7C3AED"/>
<text x="54" y="52" font-size="20" font-weight="700" fill="#221E33">谈薪策略图</text>
<text x="54" y="74" font-size="12" fill="#6B7280">谈薪四步流程 × 三情境应答卡 · 接 HR 电话前看一眼</text>
<!-- 上段：谈薪四步 -->
<rect x="40" y="104" width="4" height="16" fill="#7C3AED"/>
<text x="52" y="117" font-size="14" font-weight="700" fill="#221E33">谈薪四步流程</text>
<rect x="36" y="132" width="264" height="72" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<text x="168" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">① 探区间</text>
<text x="168" y="186" text-anchor="middle" font-size="11.5" fill="#F1EBFD">先问再答，摸清地板与天花板</text>
<rect x="324" y="132" width="264" height="72" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<text x="456" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">② 给锚点</text>
<text x="456" y="186" text-anchor="middle" font-size="11.5" fill="#F1EBFD">报区间、锚上沿、带依据</text>
<rect x="612" y="132" width="264" height="72" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<text x="744" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">③ 谈总包</text>
<text x="744" y="186" text-anchor="middle" font-size="11.5" fill="#F1EBFD">月薪之外还有六个构成</text>
<rect x="900" y="132" width="264" height="72" rx="10" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.5"/>
<text x="1032" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">④ 留余地</text>
<text x="1032" y="186" text-anchor="middle" font-size="11.5" fill="#F1EBFD">不当场答应也不当场拒绝</text>
<line x1="304" y1="168" x2="318" y2="168" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrp)"/>
<line x1="592" y1="168" x2="606" y2="168" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrp)"/>
<line x1="880" y1="168" x2="894" y2="168" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrp)"/>
<!-- 配套话术 -->
<rect x="36" y="218" width="264" height="74" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
<text x="48" y="238" font-size="10" font-weight="700" fill="#7A7590">话术</text>
<text x="168" y="266" text-anchor="middle" font-size="12" fill="#5B21B6">「这个岗位的薪资带宽大概在什么范围？」</text>
<rect x="324" y="218" width="264" height="74" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
<text x="336" y="238" font-size="10" font-weight="700" fill="#7A7590">话术</text>
<text x="456" y="262" text-anchor="middle" font-size="12" fill="#5B21B6">「结合市场带宽和我目前的</text>
<text x="456" y="282" text-anchor="middle" font-size="12" fill="#5B21B6">情况，期望在 X 到 Y 之间」</text>
<rect x="612" y="218" width="264" height="74" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
<text x="624" y="238" font-size="10" font-weight="700" fill="#7A7590">话术</text>
<text x="744" y="262" text-anchor="middle" font-size="12" fill="#5B21B6">「签字费、期权、公积金基数、</text>
<text x="744" y="282" text-anchor="middle" font-size="12" fill="#5B21B6">调薪节奏，我算下总包」</text>
<rect x="900" y="218" width="264" height="74" rx="8" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.2"/>
<text x="912" y="238" font-size="10" font-weight="700" fill="#7A7590">话术</text>
<text x="1032" y="262" text-anchor="middle" font-size="12" fill="#5B21B6">「我需要 1–2 天考虑，</text>
<text x="1032" y="282" text-anchor="middle" font-size="12" fill="#5B21B6">周四前给您答复」</text>
<!-- 下段：三情境 -->
<rect x="40" y="328" width="4" height="16" fill="#7C3AED"/>
<text x="52" y="341" font-size="14" font-weight="700" fill="#221E33">三情境应答卡</text>
<!-- 卡1 -->
<rect x="36" y="360" width="360" height="200" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="36" y="360" width="360" height="38" rx="10" fill="#2563EB"/>
<rect x="36" y="384" width="360" height="14" fill="#2563EB"/>
<text x="216" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">卡 1 · 心里有数</text>
<text x="52" y="424" font-size="11" font-weight="700" fill="#2563EB">第一动作</text>
<text x="52" y="446" font-size="12" fill="#221E33">报区间、锚上沿、带依据</text>
<text x="52" y="486" font-size="11" font-weight="700" fill="#2563EB">关键话术</text>
<text x="52" y="508" font-size="12" fill="#5B21B6">直接用四步第 ② 步</text>
<!-- 卡2 -->
<rect x="420" y="360" width="360" height="200" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="420" y="360" width="360" height="38" rx="10" fill="#2563EB"/>
<rect x="420" y="384" width="360" height="14" fill="#2563EB"/>
<text x="600" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">卡 2 · 没底</text>
<text x="436" y="424" font-size="11" font-weight="700" fill="#2563EB">第一动作</text>
<text x="436" y="446" font-size="12" fill="#221E33">先反问探区间；躲不开则</text>
<text x="436" y="464" font-size="12" fill="#221E33">报宽区间 + 校准话术</text>
<text x="436" y="496" font-size="11" font-weight="700" fill="#2563EB">关键话术</text>
<text x="436" y="518" font-size="12" fill="#5B21B6">「期望在 X 到 Y 之间，具体愿意</text>
<text x="436" y="536" font-size="12" fill="#5B21B6">结合职级和职责再沟通」</text>
<!-- 卡3 -->
<rect x="804" y="360" width="360" height="200" rx="10" fill="#FFFFFF" stroke="#C9C2DE" stroke-width="1.3"/>
<rect x="804" y="360" width="360" height="38" rx="10" fill="#2563EB"/>
<rect x="804" y="384" width="360" height="14" fill="#2563EB"/>
<text x="984" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">卡 3 · 被压价</text>
<text x="820" y="424" font-size="11" font-weight="700" fill="#2563EB">第一动作</text>
<text x="820" y="446" font-size="12" fill="#221E33">先确认总包构成，再带依据</text>
<text x="820" y="464" font-size="12" fill="#221E33">还价一次（最多两次）</text>
<text x="820" y="496" font-size="11" font-weight="700" fill="#2563EB">关键话术</text>
<text x="820" y="518" font-size="12" fill="#5B21B6">「如果月薪有预算约束，能否在</text>
<text x="820" y="536" font-size="12" fill="#5B21B6">签字费或调薪评审上安排？」</text>
<!-- 金句 -->
<text x="1164" y="612" text-anchor="end" font-size="14" font-weight="700" fill="#7C3AED">「谈薪谈的是未来，不是过去」</text>
</svg>
