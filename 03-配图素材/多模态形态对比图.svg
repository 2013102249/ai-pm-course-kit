<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">
  <rect width="1200" height="690" fill="#FFFFFF"/>

  <!-- 标题区 -->
  <rect x="40" y="28" width="4" height="22" fill="#7C3AED"/>
  <text x="54" y="46" font-size="20" font-weight="700" fill="#221E33">多模态形态对比图</text>
  <text x="54" y="66" font-size="12" fill="#6B7280">成熟度决定敢不敢做 · 成本量级决定做不做得起 · 合规风险决定会不会翻车</text>

  <!-- 表头背景 -->
  <rect x="40" y="110" width="1120" height="42" fill="#E8EFFD"/>
  <text x="150" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">形态</text>
  <text x="375" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">成熟度</text>
  <text x="580" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">成本量级</text>
  <text x="790" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">典型场景</text>
  <text x="1035" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#2563EB">合规风险</text>

  <!-- 行 1 · 文生图 -->
  <rect x="60" y="192" width="30" height="24" rx="3" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <circle cx="69" cy="200" r="2.5" fill="#7C3AED"/>
  <path d="M 62,213 L 71,203 L 77,209 L 82,205 L 88,211" fill="none" stroke="#7C3AED" stroke-width="1.4"/>
  <text x="105" y="211" font-size="17" font-weight="700" fill="#7C3AED">文生图</text>
  <rect x="282" y="198" width="26" height="14" fill="#7C3AED"/>
  <rect x="314" y="198" width="26" height="14" fill="#7C3AED"/>
  <rect x="346" y="198" width="26" height="14" fill="#7C3AED"/>
  <rect x="378" y="198" width="26" height="14" fill="#7C3AED"/>
  <rect x="410" y="198" width="26" height="14" fill="#E8E5F1"/>
  <text x="444" y="209" font-size="12.5" font-weight="700" fill="#5B21B6">高</text>
  <rect x="550" y="177" width="60" height="26" rx="13" fill="#DBEAFE"/>
  <text x="580" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">低</text>
  <text x="580" y="224" text-anchor="middle" font-size="11.5" fill="#6B7280">单次几毛到几元量级</text>
  <text x="790" y="210" text-anchor="middle" font-size="14" fill="#221E33">营销配图与电商主图</text>
  <text x="1035" y="210" text-anchor="middle" font-size="14" fill="#221E33">权属不清与风格模仿</text>

  <!-- 行 2 · 文生视频 -->
  <rect x="60" y="299" width="30" height="24" rx="3" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <path d="M 71,305 L 82,311 L 71,317 Z" fill="#7C3AED"/>
  <text x="105" y="317" font-size="17" font-weight="700" fill="#7C3AED">文生视频</text>
  <rect x="282" y="304" width="26" height="14" fill="#7C3AED"/>
  <rect x="314" y="304" width="26" height="14" fill="#7C3AED"/>
  <rect x="346" y="304" width="26" height="14" fill="#E8E5F1"/>
  <rect x="378" y="304" width="26" height="14" fill="#E8E5F1"/>
  <rect x="410" y="304" width="26" height="14" fill="#E8E5F1"/>
  <text x="444" y="315" font-size="12.5" font-weight="700" fill="#5B21B6">演进中</text>
  <rect x="550" y="283" width="60" height="26" rx="13" fill="#93C5FD"/>
  <text x="580" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#1E3A8A">高</text>
  <text x="580" y="330" text-anchor="middle" font-size="11.5" fill="#6B7280">单次几元到几十元量级</text>
  <text x="790" y="316" text-anchor="middle" font-size="14" fill="#221E33">短视频素材与广告创意</text>
  <text x="1035" y="316" text-anchor="middle" font-size="14" fill="#221E33">深度伪造与肖像</text>

  <!-- 行 3 · 语音 -->
  <rect x="69" y="402" width="12" height="18" rx="6" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <path d="M 63,414 Q 75,428 87,414" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="75" y1="424" x2="75" y2="430" stroke="#7C3AED" stroke-width="1.6"/>
  <line x1="68" y1="430" x2="82" y2="430" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="105" y="423" font-size="17" font-weight="700" fill="#7C3AED">语音</text>
  <rect x="282" y="410" width="26" height="14" fill="#7C3AED"/>
  <rect x="314" y="410" width="26" height="14" fill="#7C3AED"/>
  <rect x="346" y="410" width="26" height="14" fill="#7C3AED"/>
  <rect x="378" y="410" width="26" height="14" fill="#7C3AED"/>
  <rect x="410" y="410" width="26" height="14" fill="#7C3AED"/>
  <text x="444" y="421" font-size="12.5" font-weight="700" fill="#5B21B6">很高</text>
  <rect x="550" y="389" width="60" height="26" rx="13" fill="#DBEAFE"/>
  <text x="580" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">低</text>
  <text x="580" y="436" text-anchor="middle" font-size="11.5" fill="#6B7280">每万字几元量级</text>
  <text x="790" y="422" text-anchor="middle" font-size="14" fill="#221E33">客服播报与语音入口</text>
  <text x="1035" y="422" text-anchor="middle" font-size="14" fill="#221E33">声音克隆须授权</text>

  <!-- 行 4 · 数字人 -->
  <circle cx="75" cy="512" r="6" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <path d="M 62,534 C 62,522 88,522 88,534 Z" fill="#F1EBFD" stroke="#7C3AED" stroke-width="1.6"/>
  <text x="105" y="529" font-size="17" font-weight="700" fill="#7C3AED">数字人</text>
  <rect x="282" y="516" width="26" height="14" fill="#7C3AED"/>
  <rect x="314" y="516" width="26" height="14" fill="#7C3AED"/>
  <rect x="346" y="516" width="26" height="14" fill="#7C3AED"/>
  <rect x="378" y="516" width="26" height="14" fill="#E8E5F1"/>
  <rect x="410" y="516" width="26" height="14" fill="#E8E5F1"/>
  <text x="444" y="527" font-size="12.5" font-weight="700" fill="#5B21B6">中</text>
  <rect x="550" y="495" width="60" height="26" rx="13" fill="#2563EB"/>
  <text x="580" y="513" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">最高</text>
  <text x="580" y="542" text-anchor="middle" font-size="11.5" fill="#6B7280">按时长计费</text>
  <text x="790" y="528" text-anchor="middle" font-size="14" fill="#221E33">直播带货与虚拟主播</text>
  <text x="1035" y="528" text-anchor="middle" font-size="14" fill="#221E33">肖像冒用与身份混淆</text>

  <!-- 表格网格线 -->
  <line x1="260" y1="110" x2="260" y2="576" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="490" y1="110" x2="490" y2="576" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="670" y1="110" x2="670" y2="576" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="910" y1="110" x2="910" y2="576" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="152" x2="1160" y2="152" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="258" x2="1160" y2="258" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="364" x2="1160" y2="364" stroke="#E8E5F1" stroke-width="1"/>
  <line x1="40" y1="470" x2="1160" y2="470" stroke="#E8E5F1" stroke-width="1"/>
  <rect x="40" y="110" width="1120" height="466" fill="none" stroke="#C9C2DE" stroke-width="1.4"/>

  <!-- 底部注脚 -->
  <text x="40" y="616" font-size="13" font-weight="700" fill="#2563EB">版权口诀：先问授权，再问归属，最后再谈商用</text>
  <text x="40" y="640" font-size="12" fill="#6B7280">成本为量级示意（按次计费，价格以官网实时价格为准）；成熟度为五格相对评估，非绝对化数字</text>
</svg>
